  async function loadGame(id) {
    try {
      const r = await api('GET', `/api/games/${id}`);
      if (!r.ok) { navigate('#lobby'); return; }
      const d = await r.json();
      state.game = d.game;
      state.gameTheme = { slug: d.game.slug, country_name: d.game.country_name, accent_colour: d.game.accent_colour, footballer_name: d.game.footballer_name };
      state.credits = d.credits;
      state.regularSessionId = d.credits ? d.credits.id : null;
      state.bonusSession = d.bonus_session;
      state.bonusSessionId = d.bonus_session ? d.bonus_session.id : null;
      if (state.credits && state.credits.credits_remaining !== undefined) {
        state.credits.credits_remaining = parseInt(state.credits.credits_remaining) || 0;
      }

      state.walletBalance = d.wallet_balance;
      state.potBalance = d.captain_pot_balance;
      state.prevPotBalance = d.captain_pot_balance;
      state.squaresRevealed = d.squares_revealed;
      state.prizePot = d.prize_pot;
      state.gameEvents = d.events || {};
      state.gridSize = d.grid_size || gridSizeForStage(d.game.stage_idx);
      state.gridCols = d.grid_cols || gridColsForStage(d.game.stage_idx);
      state.bonusCreditsAvailable = d.bonus_credits_available || 0;
      if (d.pricing) state.pricing = d.pricing;

      // If game is completed, go back to lobby
      if (d.game.status === 'completed') { navigate('#lobby'); return; }

      renderGameBody();
      setupGamePolls(id);
      startKeepalive(id);

      // A kick the player has not taken yet opens again, after the tiles
      // spawn and the portrait fades in.
      // The sound only plays from the tap that uncovered the square; a timer
      // has no user gesture behind it, so the screen reopens silently.
      const pendingPenalty = d.pending_penalty || null;
      if (pendingPenalty) {
        setTimeout(() => {
          openPenaltyKick(pendingPenalty.square_index, pendingPenalty.bonus_on_goal, pendingPenalty.role);
        }, 3000);
      }
    } catch(e) {
      console.error('Game load error', e);
    }
  }

  function renderGameBody() {
    const game = state.game;
    const theme = state.gameTheme;

    // Full-window colour split (seen when the stadium fades away after a goal)
    // + CSS accent vars. The badge stays on the board, so it never moves.
    const flagBgEl = document.getElementById('flag-bg');
    if (flagBgEl) {
      flagBgEl.style.backgroundImage = flagBg(theme.slug, theme.accent_colour);
    }
    document.documentElement.style.setProperty('--accent', theme.accent_colour);
    document.documentElement.style.setProperty('--accent-soft', hexToRgba(theme.accent_colour, 0.33));
    // A re-rendered board shows the stadium again (it is hidden during the goal celebration)
    document.querySelector('.stadium')?.classList.remove('is-hidden');

    // The header always names the player's own nation, whatever order the
    // session and the themes arrived in: the slug is enough for the flag, and
    // the country name falls back to the translations.
    const mySlug = state.session ? state.session.my_team_slug : '';
    // A direct link to a match can paint before the session has arrived, which
    // left the player's own nation showing as a bare "You". Fetch it once and
    // redraw the header with the flag and country name.
    if (!mySlug && !state.teamHeaderRetried) {
      state.teamHeaderRetried = true;
      api('GET', '/api/session').then(r => r.ok ? r.json() : null).then(d => {
        if (d && d.session && d.session.my_team_slug) {
          state.session = d.session;
          if (state.game) renderGameBody();
        }
      }).catch(() => {});
    }
    const myTeam = state.themes.find(th => th.slug === mySlug) || null;
    const myTranslatedName = mySlug ? t('countries.' + mySlug) : '';
    const myName = myTeam ? myTeam.country_name
      : (myTranslatedName && myTranslatedName !== 'countries.' + mySlug)
        ? myTranslatedName
        : (mySlug ? mySlug.charAt(0).toUpperCase() + mySlug.slice(1) : 'You');
    const stageIdx = state.session ? state.session.stage_idx : game.stage_idx;

    // Portrait behind tiles — always show footballer image; trophy shown in result card for final
    const portraitBg = boardBackdrop(theme.slug, theme.accent_colour);
    const portraitSize = 'contain, cover';

    const regularShots = state.credits ? parseInt(state.credits.credits_remaining) : 0;
    const bonusShots = state.bonusCreditsAvailable || 0;
    const totalShots = regularShots + bonusShots;
    const shotsDisplay = totalShots;

    const hud = `<div class="game-hud">
      <div class="hud-chip"><span style="display:block;">${t('game.wallet_label')}</span><span class="val wallet-val">${Math.round(state.walletBalance)} t</span></div>
      <div class="hud-chip"><span style="display:block;">${t('game.prize_label')}</span><span class="val prize-val" style="color:#fbbf24;">${state.prizePot} t</span></div>
      ${potChipHtml(state.potBalance)}
      <div class="hud-chip"><span style="display:block;">${t('hud.shots_left')}</span><span class="val shots-val">${shotsDisplay}</span></div>
    </div>`;

    const myFlag = myTeam ? crestHtml(myTeam.slug, myTeam.country_name, 'flag-mini', myTeam.accent_colour) || `<div class="flag-mini" role="img" aria-label="${myTeam.country_name}" style="background:${flagBg(myTeam.slug, myTeam.accent_colour)};"></div>` : '';
    const oppFlag = crestHtml(theme.slug, theme.country_name, 'flag-mini', theme.accent_colour) || `<div class="flag-mini" role="img" aria-label="${theme.country_name}" style="background:${flagBg(theme.slug, theme.accent_colour)};"></div>`;
    const nationStrip = `<div class="nation-strip">
      ${myFlag}<span style="font-weight:700;color:#f0f0f5;">${myName} <span style="color:#fbbf24;font-weight:600;">(you)</span></span>
      <span style="color:#fbbf24;font-weight:900;font-size:0.8rem;margin:0 4px;text-shadow:0 0 8px rgba(251,191,36,0.6);letter-spacing:0.05em;">v</span>
      ${oppFlag}<span style="font-weight:700;color:#f0f0f5;">${theme.country_name}</span>
      <span style="margin-left:auto;background:rgba(0,0,0,0.55);border:1px solid rgba(251,191,36,0.5);border-radius:5px;padding:1px 7px;color:#fbbf24;font-size:0.6rem;font-family:'Space Mono',monospace;white-space:nowrap;text-transform:uppercase;letter-spacing:0.06em;box-shadow:0 0 6px rgba(251,191,36,0.2);">${stageName(stageIdx)}</span>
    </div>`;

    // Build tiles for this stage's grid; open tiles show portrait beneath.
    // Revealed Match Event squares show their graphic instead.
    const gridSize = state.gridSize || gridSizeForStage(stageIdx);
    const gridCols = state.gridCols || gridColsForStage(stageIdx);
    const revealed = game.revealed || new Array(gridSize).fill(false);
    const gameEvents = state.gameEvents || {};
    let tiles = '';
    for (let i = 0; i < gridSize; i++) {
      const isOpen = revealed[i];
      const evt = isOpen ? gameEvents[String(i)] : null;
      const meta = evt ? EVENT_META[evt] : null;
      const evtClass = meta ? ' tile-event ' + meta.cls : '';
      const evtBg = meta ? ` style="background-image:url('/images/events/${meta.file}.svg');"` : '';
      tiles += `<div class="tile${isOpen ? ' open' : ''}${evtClass}" data-idx="${i}"${evtBg} onclick="${isOpen ? '' : `onCellClick(${i})`}"></div>`;
    }

    const initialHint = `${stageName(stageIdx)} — find the ball to knock out ${theme.country_name}`;

    document.getElementById('game-body').innerHTML = `
      ${hud}
      ${nationStrip}
      <div id="retro-quip-overlay"></div>
      <div class="board-zone" id="board-zone">
        <div class="board-wrap">
          <div class="portrait" style="background-image:${portraitBg};background-size:${portraitSize};"></div>
          <div class="board game-grid" id="game-grid" style="grid-template-columns:repeat(${gridCols},1fr);">
            ${tiles}
          </div>
          <div class="reveal" id="board-reveal"></div>
        </div>
      </div>
      <div class="game-footer">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:1px 0;">
          <div id="hint-bar" class="font-dm" style="font-size:10px;color:#b0b0b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;">${initialHint}</div>
          <span class="font-dm" style="font-size:10px;color:#fbbf24;cursor:pointer;text-decoration:underline;flex-shrink:0;margin-left:8px;display:inline-flex;align-items:center;justify-content:flex-end;min-width:44px;min-height:44px;" onclick="leaveMap(${game.id})">Leave Map</span>
        </div>
      </div>`;

    // Match-start animation: fade in tiles sequentially with sparkle
    // First, hide portrait initially with transition ready
    const portraitEl = document.querySelector('.portrait');
    if (portraitEl) {
      portraitEl.style.transition = 'opacity 0.6s ease';
      portraitEl.style.opacity = '0';
    }

    // Apply random fade-in animation to tiles (spread over ~2.5 seconds with sparkles)
    const tiles_list = document.querySelectorAll('.tile');
    tiles_list.forEach((tile) => {
      tile.classList.add('tile-spawn');
      // Random delay between 0 and 2000ms so tiles appear randomly throughout 2.5s window
      // (accounting for 0.4s spawn animation, tiles finish by 2.4s total)
      tile.style.animationDelay = (Math.random() * 2000) + 'ms';
    });

    // After all tiles finish animating, apply full-board sparkle flash
    setTimeout(() => {
      tiles_list.forEach((tile) => {
        tile.classList.add('tile-sparkle-flash');
      });
    }, 2500);

    // After all tiles finish animating and sparkle flash, fade in the portrait
    setTimeout(() => {
      if (portraitEl) {
        portraitEl.style.transition = 'opacity 0.5s ease';
        portraitEl.style.opacity = '1';
      }
      // Revealed Match Event squares from an earlier visit fade out too,
      // starting once the portrait is visible.
      document.querySelectorAll('#game-grid .tile.tile-event').forEach(c => fadeEventTile(c));
    }, 3000);
  }

  function updateHud() {
    const wv = document.querySelector('.wallet-val'); if (wv) wv.textContent = Math.round(state.walletBalance) + ' t';
    const lwv = document.querySelector('.lobby-wallet-val'); if (lwv) lwv.textContent = Math.round(state.walletBalance).toLocaleString() + ' t';
    const pv = document.querySelector('.prize-val'); if (pv) pv.textContent = prizeDecay(state.squaresRevealed, state.gridSize) + ' t';

    // Update shots display
    const regularShots = state.credits ? parseInt(state.credits.credits_remaining) : 0;
    const bonusShots = state.bonusCreditsAvailable || 0;
    const totalShots = regularShots + bonusShots;
    const shotsDisplay = totalShots;
    const sv = document.querySelector('.shots-val'); if (sv) sv.textContent = shotsDisplay;
  }

  function updateCreditsDisplay() {
    updateHud();
  }

  let quipSeq = 0;
  function showRetroQuip(quipText, row, modifierClass, holdMs) {
    const mySeq = ++quipSeq;
    const overlay = document.getElementById('retro-quip-overlay');
    if (!overlay) return;

    overlay.innerHTML = `<div class="retro-quip-box${modifierClass ? ' ' + modifierClass : ''}">
      <p class="retro-quip-text">${quipText}</p>
    </div>`;
    overlay.style.display = 'block';

    const gridCols = state.gridCols || gridColsForStage(state.game.stage_idx);
    const gridSize = state.gridSize || gridSizeForStage(state.game.stage_idx);
    const tilesPerRow = gridCols;
    const totalRows = Math.ceil(gridSize / tilesPerRow);
    const thirdHeight = Math.ceil(totalRows / 3);

    let verticalPosition;
    if (row !== undefined && row !== null) {
      if (row < thirdHeight) {
        verticalPosition = 'bottom';
      } else if (row >= 2 * thirdHeight) {
        verticalPosition = 'top';
      } else {
        verticalPosition = 'top';
      }
    } else {
      verticalPosition = 'top';
    }

    if (verticalPosition === 'top') {
      overlay.style.top = '25%';
    } else {
      overlay.style.top = '75%';
    }
    overlay.style.left = '50%';
    overlay.style.transform = 'translate(-50%, -50%)';

    const quipBox = overlay.querySelector('.retro-quip-box');

    // Randomly select an exit animation
    const exitAnimations = ['fade-out', 'explode', 'dissolve', 'slide-spin', 'bounce-out'];
    const selectedAnimation = exitAnimations[Math.floor(Math.random() * exitAnimations.length)];

    // Determine animation duration based on selected animation
    const animationDurations = {
      'fade-out': 600,
      'explode': 700,
      'dissolve': 800,
      'slide-spin': 900,
      'bounce-out': 800
    };
    const animationDuration = animationDurations[selectedAnimation];

    setTimeout(() => {
      if (mySeq !== quipSeq) return;
      if (quipBox) {
        quipBox.classList.add(selectedAnimation);
      }
      setTimeout(() => {
        if (mySeq !== quipSeq) return;
        overlay.style.display = 'none';
        if (quipBox) {
          quipBox.classList.remove(selectedAnimation);
          // Clear event tint classes so the next quip renders unmodified
          quipBox.classList.remove('event-good', 'event-bad');
        }
      }, animationDuration);
    }, holdMs || 1500);
  }

  window.onCellClick = async function(idx) {
    const game = state.game;
    if (!game || game.status !== 'active') return;
    if (!game.revealed || game.revealed.length !== (state.gridSize || 36)) {
      game.revealed = new Array(state.gridSize || 36).fill(false);
    }
    if ((game.revealed || [])[idx]) return;

    const regularCredRemaining = state.credits ? parseInt(state.credits.credits_remaining) : 0;
    const bonusCredRemaining = state.bonusCreditsAvailable || 0;

    // Determine which session to use (prioritize bonus credits)
    let sessId = null;
    if (bonusCredRemaining > 0) {
      sessId = state.bonusSessionId;
    } else if (regularCredRemaining > 0) {
      sessId = state.regularSessionId;
    }

    // Only show "buy more shots" modal if both regular and bonus credits are exhausted
    if (regularCredRemaining === 0 && bonusCredRemaining === 0) {
      const p = pricingForStage(state.game.stage_idx);
      const modal = document.createElement('div');
      modal.className = 'modal-bg';
      modal.innerHTML = `<div class="modal-box">
        <div style="font-family:'DM Sans',sans-serif;font-weight:700;font-size:1.1rem;margin-bottom:12px;">${t('game.out_of_shots_title')}</div>
        <p style="font-size:0.85rem;color:#ccc;margin-bottom:16px;font-family:'DM Sans',sans-serif;">${t('game.out_of_shots_desc')}</p>
        <div style="display:flex;gap:10px;flex-direction:column;">
          <button class="bundle-btn btn-gold" style="width:100%;" onclick="const m = this.closest('.modal-bg'); m.remove(); buyBundle(2).then(() => {});">${t('game.buy_2')} — ${fmtTokens(p.bundle2)} tokens</button>
          <button class="bundle-btn btn-gold" style="width:100%;" onclick="const m = this.closest('.modal-bg'); m.remove(); buyBundle(8).then(() => {});">${t('game.buy_8')} — ${fmtTokens(p.bundle8)} tokens</button>
          <button class="bundle-btn btn-gold" style="width:100%;" onclick="const m = this.closest('.modal-bg'); m.remove(); buyBundle(16).then(() => {});">${t('game.buy_16')} — ${fmtTokens(p.bundle16)} tokens</button>
          <button class="bundle-btn btn-ghost" style="width:100%;" onclick="this.closest('.modal-bg').remove()">${t('game.close')}</button>
        </div>
      </div>`;
      document.body.appendChild(modal);
      return;
    }
    playBlip();

    const body = { square_index: idx };
    if (sessId) body.session_id = sessId;

    // Disable board during request
    document.querySelectorAll('.tile:not(.open)').forEach(c => c.style.pointerEvents = 'none');

    try {
      const r = await api('POST', `/api/games/${game.id}/guess`, body);
      if (!r.ok) {
        const e = await r.json().catch(()=>({}));
        showToast(e.error || 'Guess failed');
        document.querySelectorAll('.tile').forEach(c => c.style.pointerEvents = '');
        return;
      }
      const d = await r.json();

      // Update state
      if (!game.revealed) game.revealed = new Array(state.gridSize || 36).fill(false);
      game.revealed[idx] = true;
      state.squaresRevealed = d.squares_revealed;
      state.walletBalance = d.wallet_balance;
      state.prizePot = prizeDecay(state.squaresRevealed, state.gridSize);

      // Always read both shot counts and the bonus row id from the response,
      // so free and bought shots stay apart and a won bonus shot (or a
      // penalty free attempt on a fresh row) is spendable straight away.
      state.bonusCreditsAvailable = d.bonus_credits_available || 0;
      state.bonusSessionId = d.bonus_session_id || null;
      if (state.credits && d.regular_credits_remaining !== undefined) {
        state.credits.credits_remaining = d.regular_credits_remaining;
      }

      // If THIS player just won the jackpot, record their win timestamp so the
      // broadcast toast (meant for everyone else) is suppressed for them when
      // polling resumes after the celebration.
      if (d.jackpot_paid > 0 && d.last_won_at) state.potLastWonAt = d.last_won_at;
      updatePotChips(d.pot_balance, null);
      updateHud();
      updateCreditsDisplay();

      const cell = document.querySelector(`.tile[data-idx="${idx}"]`);

      // A penalty square opens the kick screen; the free attempts are only
      // won once it is scored, so nothing is paid here.
      if (d.is_penalty_hit) {
        updateHud();
        Sound.playPenalty();
        if (cell) cell.classList.add('open');
        document.querySelectorAll('.tile:not(.open)').forEach(c => c.style.pointerEvents = '');
        const bonusOnGoal = d.penalty ? d.penalty.bonus_on_goal : 0;
        const penaltyRole = d.penalty ? d.penalty.role : undefined;
        try {
          openPenaltyKick(idx, bonusOnGoal, penaltyRole);
        } catch (e) {
          console.error('Penalty screen failed', e);
          showToast(t('penalty.found_toast', { n: bonusOnGoal }));
        }
      } else if (d.hit) {
        Sound.playFindball();
        await runWinSequence(cell, idx, d);
      } else {
        // Miss. A match event square shows its graphic right away, holds for
        // EVENT_TILE_HOLD_MS, then fades out so the portrait slice underneath
        // shows through. A plain miss flips and falls off-screen.
        const meta = d.event && d.event.type ? EVENT_META[d.event.type] : null;
        // Show retro quip overlay with smart positioning based on tile row.
        // A Match Event replaces the random quip with its own banner, sound
        // and uncovered graphic.
        const gridCols = state.gridCols || gridColsForStage(state.game.stage_idx);
        const tileRow = Math.floor(idx / gridCols);
        if (meta) {
          if (cell) {
            // The event graphic is readable straight away while the tile
            // holds, then it fades away
            cell.style.backgroundImage = `url('/images/events/${meta.file}.svg')`;
            // Drop any spawn one-shots and their inline delay so the hold
            // starts from the tap and no other animation delays the fade.
            cell.classList.remove('tile-spawn', 'tile-sparkle-flash');
            cell.style.animationDelay = '';
            cell.classList.add('tile-event', meta.cls);
            cell.style.pointerEvents = 'none';
            fadeEventTile(cell);
          }
          // The event banner sound plays right away with the message
          Sound[meta.kind === 'good' ? 'eventGood' : 'eventBad'](d.event.type);
          // Banner shows the event name and the signed amount, e.g. "HANDBALL! -4 t"
          const amount = Math.abs(d.event.delta);
          const sign = d.event.delta >= 0 ? '+' : '-';
          const msg = t('events.' + d.event.type, { amount: sign + amount + ' t' });
          showRetroQuip(msg, tileRow, meta.kind === 'good' ? 'event-good' : 'event-bad', 3500);
        } else {
          if (cell) {
            // Plain miss — expose the empty square with a 3D flip, then gravity fall off-screen
            // The finished spawn one-shots still sit on the class list and their
            // later-defined animation shorthands would override .tile-fall —
            // drop them, and clear the inline spawn delay that would otherwise
            // delay the fall too.
            cell.classList.remove('tile-spawn', 'tile-sparkle-flash');
            cell.style.animationDelay = '';
            const isFast = Math.random() < 0.33;
            const tilt = (Math.random() < 0.5 ? -1 : 1) * (8 + Math.random() * 12);
            const drift = (Math.random() * 48) - 24;
            cell.style.setProperty('--fall-tilt', tilt.toFixed(1) + 'deg');
            cell.style.setProperty('--fall-drift', drift.toFixed(1) + 'px');
            cell.classList.add('tile-fall');
            if (isFast) cell.classList.add('reveal-fast');
            const cleanupTime = isFast ? 550 : 1100;
            setTimeout(() => { cell.classList.add('open'); cell.classList.remove('tile-fall'); if (isFast) cell.classList.remove('reveal-fast'); cell.style.pointerEvents = 'none'; }, cleanupTime);
          }
          // A bonus square opens like a plain miss (flip and fall) but its
          // banner replaces the random quip, with its own sound.
          if (d.bonus_square) {
            const win = d.bonus_square.outcome === 'win';
            const key = win ? 'bonus.win'
              : (d.bonus_square.delta === -1 ? 'bonus.lose' : 'bonus.lose_none');
            if (win) Sound.bonusWin(); else Sound.bonusLose();
            showRetroQuip(t(key), tileRow, win ? 'event-good' : 'event-bad', 3500);
          } else {
            const quip = QUIPS[Math.floor(Math.random() * QUIPS.length)];
            showRetroQuip(quip, tileRow);
          }
        }
        document.querySelectorAll('.tile:not(.open):not(.tile-fall):not(.tile-event)').forEach(c => c.style.pointerEvents = '');
        // The fading or falling tile stays untappable until its own timeout opens it
        if (cell) cell.style.pointerEvents = 'none';
      }
    } catch(e) {
      console.error('Guess error', e);
      document.querySelectorAll('.tile').forEach(c => c.style.pointerEvents = '');
    }
  };

  // ═══════════════════════════════════════════════════════════════
  // GOAL CELEBRATION
  // ═══════════════════════════════════════════════════════════════
  function playGoalCelebration(accentColor, isFinal) {
    const stageIdx = state.session ? state.session.stage_idx : state.game.stage_idx;
    const animationStart = performance.now();

    // Screen shake (0–600ms)
    const app = document.getElementById('app');
    if (app) app.classList.add('screen-shake');
    setTimeout(() => app && app.classList.remove('screen-shake'), 600);

    // Shockwave pulse from center (0–800ms)
    const shockwave = document.createElement('div');
    shockwave.className = 'shockwave';
    shockwave.style.borderColor = accentColor || '#fbbf24';
    document.body.appendChild(shockwave);
    setTimeout(() => shockwave.remove(), 800);

    // Confetti burst (15 particles, all removed at 2200ms)
    for (let i = 0; i < 15; i++) {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      const chars = ['🎉', '⭐', '✨', '🌟', '💫'];
      confetti.textContent = chars[Math.floor(Math.random() * chars.length)];

      const angle = (Math.random() * 360) * (Math.PI / 180);
      const velocity = 120 + Math.random() * 180;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity - 60; // gravity offset
      const rot = Math.random() * 720;

      confetti.style.setProperty('--tx', tx + 'px');
      confetti.style.setProperty('--ty', ty + 'px');
      confetti.style.setProperty('--rot', rot + 'deg');
      confetti.style.left = '50%';
      confetti.style.top = '50%';
      confetti.style.marginLeft = '-0.6rem';
      confetti.style.marginTop = '-0.6rem';

      document.body.appendChild(confetti);
      setTimeout(() => confetti.remove(), 2200);
    }

    // Floating emojis (5 emojis floating upward, staggered, all done by 2400ms + stagger)
    const emojiSet = ['⚽', '⭐', '🎊'];
    for (let i = 0; i < 5; i++) {
      const emoji = document.createElement('div');
      emoji.className = 'floating-emoji';
      emoji.textContent = emojiSet[Math.floor(Math.random() * emojiSet.length)];

      const xPos = 20 + Math.random() * 60;
      emoji.style.left = xPos + '%';
      emoji.style.bottom = '10%';
      emoji.style.animation = `emoji-float 2.4s ease-out ${i * 0.15}s forwards`;

      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 2400 + i * 150);
    }

    // GOAL text overlay (appears at 0, removed at 2600ms)
    const goalOverlay = document.createElement('div');
    goalOverlay.style.cssText = `
      position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      z-index:280;pointer-events:none;text-align:center;
    `;

    const goalText = isFinal ? t('celebration.champions') : t('celebration.goal');
    const subtitleText = isFinal ? t('celebration.won_cup') : t('celebration.scored');
    const fontSize = isFinal ? 'clamp(1.8rem, 4.5vw, 4.5rem)' : 'clamp(2rem, 5vw, 5.5rem)';

    goalOverlay.innerHTML = `
      <div class="goal-text" style="
        font-family:'DM Sans',sans-serif;font-size:${fontSize};font-weight:900;
        color:${accentColor || '#fbbf24'};
        text-shadow:0 0 20px ${accentColor || '#fbbf24'}77,
                    0 4px 12px rgba(0,0,0,0.8);
        line-height:1;margin:0;white-space:nowrap;
      ">${goalText}</div>
      <div class="goal-subtitle" style="
        font-family:'DM Sans',sans-serif;font-size:1rem;
        color:#ccc;margin-top:8px;letter-spacing:0.05em;
        text-transform:uppercase;font-weight:600;
      ">${subtitleText}</div>
    `;

    document.body.appendChild(goalOverlay);
    setTimeout(() => goalOverlay.remove(), 600);
  }

  // ═══════════════════════════════════════════════════════════════
  // WIN SEQUENCE
  // ═══════════════════════════════════════════════════════════════
  // Fly refunded shots from the final win card up to the Wallet chip as coins
  function playRefundCoins(overlay, result, targetSelector) {
    const summary = overlay.querySelector('.refund-summary');
    if (!summary) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      summary.style.opacity = '1';
      return;
    }
    const count = Math.min(12, Math.max(1, result.shots_refunded || 1));
    const originRect = summary.getBoundingClientRect();
    const originX = originRect.left + originRect.width / 2;
    const originY = originRect.top + originRect.height / 2;
    let tx, ty;
    const walletEl = document.querySelector(targetSelector || '.wallet-val');
    const walletChip = walletEl ? walletEl.closest('.hud-chip') : null;
    if (walletEl) {
      const wr = walletEl.getBoundingClientRect();
      if (wr.width > 0 || wr.height > 0) {
        tx = wr.left + wr.width / 2 - originX;
        ty = wr.top + wr.height / 2 - originY;
      }
    }
    if (tx === undefined) {
      // No wallet chip found — blow the coins off the side of the screen
      tx = window.innerWidth + 40 - originX;
      ty = -(originY * 0.3);
    }
    const layer = document.createElement('div');
    layer.className = 'refund-coin-layer';
    overlay.appendChild(layer);
    let ended = 0;
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      if (!summary.isConnected) return; // overlay already removed by Continue
      summary.style.transition = 'opacity 0.4s ease';
      summary.style.opacity = '1';
      if (walletChip) {
        walletChip.classList.add('refund-glow');
        setTimeout(() => { walletChip.classList.remove('refund-glow'); }, 700);
      }
    };
    for (let i = 0; i < count; i++) {
      const coin = document.createElement('span');
      coin.className = 'refund-coin';
      coin.innerHTML = '<span>t</span>';
      const jx = (Math.random() - 0.5) * 16;
      const jy = (Math.random() - 0.5) * 16;
      const sway = (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 50);
      coin.style.left = (originX + jx - 9) + 'px';
      coin.style.top = (originY + jy - 9) + 'px';
      coin.style.setProperty('--tx', (tx + (Math.random() - 0.5) * 10) + 'px');
      coin.style.setProperty('--ty', (ty + (Math.random() - 0.5) * 10) + 'px');
      coin.style.setProperty('--sway', sway + 'px');
      coin.style.animationDelay = (i * 110) + 'ms';
      coin.addEventListener('animationend', () => {
        coin.remove();
        ended++;
        if (ended >= count) finish();
      });
      layer.appendChild(coin);
    }
    // Fallback: show the summary even if animationend never fires
    setTimeout(finish, count * 110 + 1400 + 300);
  }

  // ═══════════════════════════════════════════════════════════════
  // PENALTY KICK
  // ═══════════════════════════════════════════════════════════════
  // Six aim zones: 0-2 the top row (left, middle, right), 3-5 the bottom row.
  const PK_DIVE_ROTATION = [-55, 0, 55, -55, 0, 55];
  const PK_LAND_ROTATION = [-90, 0, 90, -90, 0, 90];

  function openPenaltyKick(squareIdx, bonusOnGoal, role) {
    if (!state.game) return;
    if (document.querySelector('.penalty-modal')) return;
    const n = bonusOnGoal || 0;
    const asKeeper = role === 'keeper';

    const overlay = document.createElement('div');
    overlay.className = 'modal-bg penalty-modal';
    overlay.innerHTML = `<div class="modal-box penalty-box">
      <button class="pk-close" aria-label="${t('penalty.close')}">×</button>
      <div class="pk-title">${asKeeper ? t('penalty.keeper_title') : t('penalty.title')}</div>
      <div class="pk-sub">${asKeeper ? t('penalty.keeper_subtitle', { n }) : t('penalty.subtitle', { n })}</div>
      ${asKeeper ? `<div class="pk-dive-row">
        ${[0, 1, 2].map(dv => `<button class="pk-dive" data-dive="${dv}">${t('penalty.dive_' + dv)}</button>`).join('')}
      </div>` : ''}
      <div class="pk-goal">
        ${[0, 1, 2, 3, 4, 5].map(z => `<button class="pk-zone" data-zone="${z}" aria-label="${t('penalty.zone_' + z)}"${asKeeper ? ' disabled tabindex="-1"' : ''}></button>`).join('')}
        <div class="pk-keeper" aria-hidden="true">
          <span class="pk-keeper-arm left"></span><span class="pk-keeper-arm right"></span>
          <span class="pk-keeper-leg left"></span><span class="pk-keeper-leg right"></span>
          <span class="pk-keeper-torso"></span><span class="pk-keeper-head"></span>
        </div>
        <div class="pk-ball"><img src="/images/football.svg" alt=""></div>
      </div>
      <div class="pk-pitch"></div>
      <div class="pk-result"></div>
      <div class="pk-actions" style="display:flex;flex-direction:column;gap:10px;"></div>
    </div>`;
    document.body.appendChild(overlay);

    const goalEl = overlay.querySelector('.pk-goal');
    const ballEl = overlay.querySelector('.pk-ball');
    const keeperEl = overlay.querySelector('.pk-keeper');
    const zones = Array.from(overlay.querySelectorAll('.pk-zone'));
    const dives = Array.from(overlay.querySelectorAll('.pk-dive'));
    const resultEl = overlay.querySelector('.pk-result');
    const actionsEl = overlay.querySelector('.pk-actions');
    overlay.querySelector('.pk-close').addEventListener('click', () => overlay.remove());

    // Move an element to the centre of a goal zone. Both start from the
    // middle of the goal (the spot), so the change reads as the shot.
    const aimAt = (el, targetEl) => {
      const gr = goalEl.getBoundingClientRect();
      const zr = targetEl.getBoundingClientRect();
      const dx = (zr.left + zr.width / 2) - (gr.left + gr.width / 2);
      el.style.left = `calc(50% + ${dx}px)`;
      el.style.bottom = `${gr.bottom - (zr.top + zr.height / 2)}px`;
    };

    // Land the keeper with his gloves on a zone. aimAt puts the box's
    // unrotated bottom edge on the zone centre, and the landing rotation then
    // swings the gloves right off it; instead anchor the glove midpoint on the
    // centre, then clamp so no part of the keeper leaves the goal.
    // The box is 56x76 with transform-origin 50% 70%, so the pivot is
    // (28, 53.2). The glove midpoint sits 58.7px above the pivot, or the
    // torso centre (y 35) when the keeper takes a low ball.
    const landKeeperAt = (zoneEl, deg, low) => {
      if (!zoneEl) return;
      const gr = goalEl.getBoundingClientRect();
      const W = goalEl.clientWidth;
      const H = goalEl.clientHeight;
      const zr = zoneEl.getBoundingClientRect();
      const Z = {
        x: zr.left + zr.width / 2 - (gr.left + goalEl.clientLeft),
        y: zr.top + zr.height / 2 - (gr.top + goalEl.clientTop),
      };
      const Ay = (low ? 35 : -5.5) - 53.2;
      const rad = deg * Math.PI / 180;
      const cos = Math.cos(rad), sin = Math.sin(rad);
      // Pivot P such that the anchor point (0, Ay) lands on the zone centre.
      const P = { x: Z.x + Ay * sin, y: Z.y - Ay * cos };
      // Rotated corners of the box, allowing 11px above the top edge for the
      // raised gloves; shift P by the least amount that keeps them inside.
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      [[0, -11], [56, -11], [0, 76], [56, 76]].forEach(([cx, cy]) => {
        const dx = cx - 28, dy = cy - 53.2;
        const x = P.x + dx * cos - dy * sin;
        const y = P.y + dx * sin + dy * cos;
        minX = Math.min(minX, x); maxX = Math.max(maxX, x);
        minY = Math.min(minY, y); maxY = Math.max(maxY, y);
      });
      if (minX < 0) P.x -= minX; else if (maxX > W) P.x -= maxX - W;
      if (minY < 0) P.y -= minY; else if (maxY > H) P.y -= maxY - H;
      // margin-left: -28 keeps the box centred on the pivot.
      keeperEl.style.left = `calc(50% + ${P.x - W / 2}px)`;
      // The pivot is 22.8px above the box's bottom edge.
      keeperEl.style.bottom = `${H - P.y - 22.8}px`;
    };

    let kicking = false;
    // As taker the player aims at a zone; as keeper they pick a side to dive
    // to and the server rolls where the ball goes.
    const takeKick = async (zoneIdx, diveIdx) => {
      if (kicking) return;
      kicking = true;
      zones.forEach(z => { z.disabled = true; });
      dives.forEach(b => { b.disabled = true; });
      if (asKeeper) dives[diveIdx].classList.add('aim');
      else zones[zoneIdx].classList.add('aim');
      const closeBtn = overlay.querySelector('.pk-close');
      if (closeBtn) closeBtn.style.display = 'none';

      const gameId = state.game.id;
      let d;
      try {
        const body = asKeeper ? { square_index: squareIdx, dive: diveIdx } : { square_index: squareIdx, zone: zoneIdx };
        const r = await api('POST', `/api/games/${gameId}/penalty-kick`, body);
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          overlay.remove();
          if (e.error === 'Already kicked') { loadGame(gameId); return; }
          showToast(t('penalty.failed'));
          return;
        }
        d = await r.json();
      } catch (err) {
        console.error('Penalty kick failed', err);
        overlay.remove();
        showToast(t('penalty.failed'));
        return;
      }

      // The ball flies to the zone the server gives, the keeper dives to his.
      aimAt(ballEl, zones[d.zone]);
      const keeperZone = Number.isInteger(d.keeper_zone) ? d.keeper_zone : 0;
      // As keeper a save covers the whole column, so land where the ball went.
      const landZone = asKeeper && !d.scored && Number.isInteger(d.zone) ? d.zone : keeperZone;
      const landDeg = PK_LAND_ROTATION[landZone] || 0;
      const low = landZone === 4;
      keeperEl.classList.toggle('low', low);
      keeperEl.style.setProperty('--pk-dive', `${PK_DIVE_ROTATION[landZone] || 0}deg`);
      keeperEl.style.setProperty('--pk-land', `${landDeg}deg`);
      landKeeperAt(zones[landZone] || zones[0], landDeg, low);
      keeperEl.classList.add('diving');

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      await new Promise(res => setTimeout(res, reduced ? 0 : 700));
      keeperEl.classList.add('landed');

      state.bonusCreditsAvailable = d.bonus_credits_available || 0;
      state.bonusSessionId = d.bonus_session_id || null;
      if (state.credits && d.regular_credits_remaining !== undefined) {
        state.credits.credits_remaining = d.regular_credits_remaining;
      }
      updateHud();

      const won = asKeeper ? !d.scored : d.scored;
      if (won) {
        resultEl.innerHTML = `<div class="refund-summary">${asKeeper ? t('penalty.keeper_saved', { n: d.bonus_credits_awarded }) : t('penalty.goal', { n: d.bonus_credits_awarded })}</div>`;
        Sound.bonusWin();
        playRefundCoins(overlay, { shots_refunded: d.bonus_credits_awarded }, '.shots-val');
        const shotsChip = document.querySelector('.shots-val');
        if (shotsChip && shotsChip.closest('.hud-chip')) {
          shotsChip.closest('.hud-chip').classList.add('refund-glow');
          setTimeout(() => shotsChip.closest('.hud-chip').classList.remove('refund-glow'), 700);
        }
      } else {
        resultEl.textContent = asKeeper ? t('penalty.conceded') : t('penalty.saved');
        Sound.bonusLose();
      }

      const btn = document.createElement('button');
      btn.className = 'bundle-btn btn-gold';
      btn.style.width = '100%';
      btn.textContent = t('penalty.continue');
      btn.addEventListener('click', () => {
        overlay.remove();
        if (d.pending_penalty) openPenaltyKick(d.pending_penalty.square_index, d.pending_penalty.bonus_on_goal, d.pending_penalty.role);
      });
      actionsEl.appendChild(btn);
      btn.focus();
    };

    if (asKeeper) {
      dives.forEach(b => b.addEventListener('click', () => takeKick(null, parseInt(b.dataset.dive, 10))));
    } else {
      zones.forEach(z => z.addEventListener('click', () => takeKick(parseInt(z.dataset.zone, 10))));
    }
  }
  window.openPenaltyKick = openPenaltyKick;

  async function runWinSequence(hitCell, idx, result) {
    clearPolls();
    const isFinal = (state.session && state.session.stage_idx >= 6) || result.interstitial === 'final_win';
    const theme = state.gameTheme;
    const stageIdx = state.session ? state.session.stage_idx : state.game.stage_idx;

    // Play goal celebration with palette-aware colors
    const palette = stageIdx >= 3 ? KNOCKOUT_PALETTES[stageIdx] : null;
    const accentColor = palette ? palette.accent : '#fbbf24';

    // The board's badge stays exactly where it is for the whole celebration:
    // the portrait is left untouched, and the stadium fades away to the club
    // colours, so no second, larger badge appears behind the board.
    const flagBgEl = document.getElementById('flag-bg');
    if (flagBgEl) {
      flagBgEl.style.setProperty('--overlay-opacity', '0');
    }
    document.querySelector('.stadium')?.classList.add('is-hidden');

    playGoalCelebration(accentColor, isFinal);

    // Start tile exit animation immediately (at 0s) when celebration words appear
    document.querySelectorAll('.tile').forEach((tile, idx) => {
      tile.classList.add('tile-exit');
      // Stagger the animation start with a random delay for visual interest
      tile.style.animationDelay = (Math.random() * 0.3) + 'ms';
      // After animation completes, mark as open for CSS transparency
      setTimeout(() => { tile.classList.add('open'); }, 800);
    });

    let resultShown = false;
    const boardZone = document.getElementById('board-zone');

    // Helper to show result card and clean up
    const showResult = async () => {
      // Prevent showing result multiple times
      if (resultShown) return;
      resultShown = true;

      stopConfetti();
      document.getElementById('goal-ball')?.remove();
      document.querySelectorAll('.tile').forEach(c => { c.classList.add('open'); });

      // Ensure nameTag (factbox) is visible before displaying result card
      const nameTagEl = document.getElementById('nametag-box');
      if (nameTagEl) {
        nameTagEl.style.opacity = '1';
        nameTagEl.style.animation = 'none';
        nameTagEl.style.display = 'block';
        nameTagEl.style.visibility = 'visible';
      }

      let resultTitle = 'You found the net!';
      if (result.jackpot_paid > 0) resultTitle = "Captain's Jackpot!";
      else if (isFinal) resultTitle = 'European Champions!';
      else if (stageIdx >= 3) resultTitle = `${theme.country_name} knocked out!`;

      state.pendingResult = result;
      let refundHtml = '';
      if (result.credits_refunded > 0) {
        const amt = result.credits_refunded;
        const amtStr = Number.isInteger(amt) ? `${Math.round(amt)}` : amt.toFixed(1);
        const n = result.shots_refunded || 0;
        const countPart = n > 0 ? (n === 1 ? '1 shot back, ' : `${n} shots back, `) : '';
        const willFly = isFinal && !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        refundHtml = `<div class="refund-summary"${willFly ? ' style="opacity:0;"' : ''}>Bundle refund: ${countPart}+${amtStr} t</div>`;
      }
      const resultCard = document.createElement('div');
      resultCard.className = 'result-overlay';
      resultCard.style.cssText = `position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);`;
      const icon = isFinal ? '🏆' : '⚽';
      const iconHtml = isFinal ? '' : `<div style="font-size:2rem;margin-bottom:8px;">${icon}</div>`;
      resultCard.innerHTML = `
        <div class="result-card">
          ${iconHtml}
          <div style="font-family:'DM Sans',sans-serif;font-size:1.3rem;font-weight:700;margin-bottom:4px;">${resultTitle}</div>
          ${result.jackpot_paid > 0 && !isFinal ? `<div style="font-size:0.85rem;color:#aaa;margin-bottom:4px;">${stageIdx >= 3 ? theme.country_name + ' knocked out!' : 'You found the net!'}</div>` : ''}
          <div style="font-family:'Space Mono',monospace;color:#fbbf24;font-size:1.1rem;margin:12px 0;">+${result.prize_paid} tokens</div>
          ${result.jackpot_paid > 0 ? `<div style="font-family:'Space Mono',monospace;color:#fff;font-size:0.9rem;margin-bottom:4px;">⚡ Captain's Pot: +${Math.round(result.jackpot_paid)} tokens</div>` : ''}
          ${result.pot_topup > 0 ? `<div style="font-family:'DM Sans',sans-serif;color:#fbbf24;font-size:0.82rem;margin:8px 0 4px;line-height:1.3;">⚡ ${result.pot_topup} tokens added to the Captain's Pot — ${stageName(result.new_stage_idx)} odds!</div>` : ''}
          ${result.credits_refunded > 0 ? refundHtml : ''}
          <button class="bundle-btn btn-gold" style="width:100%;margin-top:12px;" onclick="handleInterstitial()">Continue →</button>
        </div>`;
      document.body.appendChild(resultCard);

      if (isFinal && result.credits_refunded > 0) {
        playRefundCoins(resultCard, result);
      }

      if (result.new_stage_idx !== null) {
        if (state.session) state.session.stage_idx = result.new_stage_idx;
      }
    };

    // Step 1: shake hit tile (800ms)
    if (hitCell) hitCell.classList.add('shake');

    // Create banner immediately so it appears with ball animation
    let banner = 'GOAL!';
    if (result.jackpot_paid > 0) banner = 'HOLE IN ONE!';
    else if (isFinal) banner = 'EUROPEAN CHAMPIONS!';
    else if (stageIdx >= 3) banner = 'You won!';

    const bannerEl = document.createElement('div');
    bannerEl.style.cssText = `position:absolute;top:20px;left:0;right:0;text-align:center;z-index:60;animation:toast-in 0.5s ease;`;

    // Pick a random 80s GOAL text treatment
    const goalTreatments = ['goal-neon-flicker', 'goal-marquee', 'goal-stack-pulse'];
    const selectedTreatment = goalTreatments[Math.floor(Math.random() * goalTreatments.length)];

    if (selectedTreatment === 'goal-marquee') {
      bannerEl.innerHTML = `<span class="goal-marquee" style="font-family:'DM Sans',sans-serif;font-size:clamp(1.2rem,5vw,2rem);font-weight:900;color:#fbbf24;text-shadow:0 0 20px rgba(251,191,36,0.7);display:inline-block;">GOAL! GOAL! GOAL!</span>`;
    } else {
      bannerEl.innerHTML = `<span class="${selectedTreatment}" style="font-family:'DM Sans',sans-serif;font-size:clamp(1.2rem,5vw,2rem);font-weight:900;display:inline-block;text-shadow:0 0 20px rgba(251,191,36,0.7);">${banner}</span>`;
    }
    boardZone && boardZone.appendChild(bannerEl);

    // Clean up any stale nameTag from a previous game
    document.querySelectorAll('#nametag-box').forEach(el => el.remove());

    // Create name tag but don't append yet — will show after 5s portrait reveal
    const nameTag = document.createElement('div');
    nameTag.id = 'nametag-box';
    nameTag.style.cssText = `position:absolute;bottom:12px;left:0;right:0;text-align:center;z-index:60;padding:0 8px;`;
    const footballerText = `${theme.footballer_name}, ${theme.country_name}`;
    const fact = !isFinal ? (FOOTBALLER_FACTS[theme.slug] || '') : '';
    const factHtml = fact ? `<div style="font-family:'DM Sans',sans-serif;font-size:clamp(0.6rem, 1.5vw, 0.68rem);font-style:italic;color:#fbbf24;margin-top:4px;line-height:1.35;max-width:90vw;word-wrap:break-word;overflow-wrap:break-word;">${fact}</div>` : '';
    nameTag.innerHTML = `<div style="display:inline-block;max-width:90vw;background:rgba(0,0,0,0.84);padding:7px 14px 8px;border-radius:16px;text-align:center;">
      <div style="font-family:'DM Sans',sans-serif;font-size:clamp(0.7rem, 2vw, 0.9rem);color:white;font-weight:600;max-width:90vw;word-wrap:break-word;overflow-wrap:break-word;">${footballerText}</div>
      ${factHtml}
    </div>`;

    startConfetti();

    // Stop confetti after 3 seconds
    const confettiStopTimer = setTimeout(() => { stopConfetti(); }, 3000);

    await sleep(800);

    // Step 2: float football/trophy to centre — total 2s from start
    const icon = isFinal ? '🏆' : '⚽';
    const objEl = document.createElement('div');
    objEl.id = 'goal-ball';
    objEl.style.cssText = `position:fixed;font-size:80px;z-index:200;pointer-events:none;transition:all 0.6s cubic-bezier(.22,1,.36,1);`;

    // Randomize starting position from different edges/corners of the board
    const boardZoneRect = boardZone.getBoundingClientRect();
    const boardCenterX = boardZoneRect.left + boardZoneRect.width / 2;
    const boardCenterY = boardZoneRect.top + boardZoneRect.height / 2;
    const edgeOffset = 120;

    const edges = ['left', 'right', 'top', 'bottom', 'top-left', 'top-right', 'bottom-left', 'bottom-right'];
    const randomEdge = edges[Math.floor(Math.random() * edges.length)];
    let startX = boardCenterX;
    let startY = boardCenterY;

    switch(randomEdge) {
      case 'left': startX = boardZoneRect.left - edgeOffset; break;
      case 'right': startX = boardZoneRect.right + edgeOffset; break;
      case 'top': startY = boardZoneRect.top - edgeOffset; break;
      case 'bottom': startY = boardZoneRect.bottom + edgeOffset; break;
      case 'top-left': startX = boardZoneRect.left - edgeOffset; startY = boardZoneRect.top - edgeOffset; break;
      case 'top-right': startX = boardZoneRect.right + edgeOffset; startY = boardZoneRect.top - edgeOffset; break;
      case 'bottom-left': startX = boardZoneRect.left - edgeOffset; startY = boardZoneRect.bottom + edgeOffset; break;
      case 'bottom-right': startX = boardZoneRect.right + edgeOffset; startY = boardZoneRect.bottom + edgeOffset; break;
    }

    objEl.style.left = startX + 'px';
    objEl.style.top = startY + 'px';
    objEl.textContent = icon;
    document.body.appendChild(objEl);
    await sleep(50);

    // Randomized spin: 3–6 rotations, 1.6–2.8s duration, random direction
    const spinRotations = 3 + Math.floor(Math.random() * 4); // 3-6
    const spinDirection = Math.random() < 0.5 ? 1 : -1;
    const spinDuration = 1600 + Math.random() * 1200; // 1.6-2.8s
    const spinAmount = spinRotations * 360 * spinDirection;

    objEl.style.setProperty('--spin-amount', spinAmount + 'deg');
    objEl.style.setProperty('--spin-duration', spinDuration + 'ms');

    objEl.style.left = '50%';
    objEl.style.top = '40%';
    objEl.style.transform = `translate(-50%, -50%) scale(1.5)`;
    objEl.style.filter = 'drop-shadow(0 0 20px gold)';
    objEl.classList.add('goal-spin');

    await sleep(Math.max(spinDuration, 1150) + 200); // 800 + 50 + spin duration = ~2500-3000ms total

    // Fade out icon
    objEl.style.transition = 'opacity 0.45s';
    objEl.style.opacity = '0';
    // Flag overlay is already at 0 opacity (set at start of celebration)
    setTimeout(() => { objEl.remove(); }, 500);

    // Tiles are already animating from start of celebration (0s), uncovering
    // the badge where it sits behind the board.
    // Wait ~2-3 seconds before appending name tag at 4-5 second mark
    await sleep(1000);

    // Confetti already stopped at 3s mark, now show the name tag with trivia
    // Keep nameTag visible for 4 seconds (fade in 0.5s, visible 4s, then fade out)
    nameTag.style.animation = 'toast-in 0.5s ease, fadeout 3s ease 4.5s forwards';
    boardZone && boardZone.appendChild(nameTag);

    // Wait while name tag is visible and fading (~7-8 seconds total from goal scored)
    await sleep(6000);

    // Show result card directly without fade-to-black transition
    clearTimeout(confettiStopTimer);
    return showResult();
  }

  // ═══════════════════════════════════════════════════════════════
  // ROUND-UP — how the rest of the round went, between matches
  // ═══════════════════════════════════════════════════════════════
  // Seeded RNG (FNV-1a hash into mulberry32) so one tournament always
  // shows the same round-up.
  function seededRng(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Fictional, repeatable results for the round just played. `s` is that round:
  // 0-2 group, 3 Round of 16, 4 Quarter-Final, 5 Semi-Final.
  function buildRoundup(session, themes) {
    const me = session.my_team_slug;
    const played = session.played_slugs || [];
    const s = session.stage_idx - 1;
    const known = sl => !!sl && themes.some(t => t.slug === sl);
    const seedBase = me + '|' + (played[0] || '') + '|';
    const rngFor = r => seededRng(seedBase + r);

    const shuffle = (rng, arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a;
    };
    // Pairs a pool into ties. The odd team out rests (group) or goes through
    // on a bye (knockout); a `forced` team always plays rather than taking the
    // bye, and two forced teams are never paired with each other.
    const pairPool = (rng, pool, forcedList) => {
      const forced = new Set((forcedList || []).filter(Boolean));
      let rest = shuffle(rng, pool);
      let bye = null;
      if (rest.length % 2 === 1) {
        const candidates = rest.filter(sl => !forced.has(sl));
        bye = candidates.length ? candidates[Math.floor(rng() * candidates.length)] : rest[rest.length - 1];
        rest = rest.filter(sl => sl !== bye);
      }
      const pairs = [];
      for (let i = 0; i + 1 < rest.length; i += 2) pairs.push([rest[i], rest[i + 1]]);
      for (let i = 0; i < pairs.length; i++) {
        if (!(forced.has(pairs[i][0]) && forced.has(pairs[i][1]))) continue;
        for (let j = 0; j < pairs.length; j++) {
          if (j === i || forced.has(pairs[j][0]) || forced.has(pairs[j][1])) continue;
          const loser = pairs[i][1];
          pairs[i] = [pairs[i][0], pairs[j][0]];
          pairs[j] = [pairs[j][1], loser];
          break;
        }
      }
      return { pairs, bye };
    };
    // A level scoreline, as the extra time / penalties starting point or a group draw.
    const level = rng => { const v = Math.floor(rng() * 3); return [v, v]; };

    const groupTie = (rng, a, b) => {
      if (rng() < 0.25) {                       // a draw is allowed in the group
        const [sa, sb] = level(rng);
        return { a, b, sa, sb, winner: null, note: '' };
      }
      const winner = rng() < 0.5 ? a : b;
      const w = 1 + Math.floor(rng() * 4);
      return winner === a
        ? { a, b, sa: w, sb: Math.floor(rng() * w), winner, note: '' }
        : { a, b, sa: Math.floor(rng() * w), sb: w, winner, note: '' };
    };

    const knockoutTie = (rng, a, b, forced) => {
      const winner = forced.has(a) ? a : forced.has(b) ? b : (rng() < 0.5 ? a : b);
      const roll = rng();
      if (roll < 0.15) {                        // decided on penalties
        const [sa, sb] = level(rng);
        const w = 3 + Math.floor(rng() * 3);
        const l = Math.min(w - 1, 2 + Math.floor(rng() * 3));
        return { a, b, sa, sb, winner, note: `Pens ${w}–${l}` };
      }
      if (roll < 0.30) {                        // decided in extra time
        const [sa, sb] = level(rng);
        return { a, b, sa: winner === a ? sa + 1 : sa, sb: winner === b ? sb + 1 : sb, winner, note: 'After extra time' };
      }
      const w = 1 + Math.floor(rng() * 4);
      return winner === a
        ? { a, b, sa: w, sb: Math.floor(rng() * w), winner, note: '' }
        : { a, b, sa: Math.floor(rng() * w), sb: w, winner, note: '' };
    };

    let roundTies = [];
    if (s <= 2) {
      const rng = rngFor(s);
      const pool = themes.map(t => t.slug).filter(sl => sl !== me && sl !== played[s]);
      const { pairs } = pairPool(rng, pool, []);
      roundTies = pairs.map(([a, b]) => groupTie(rng, a, b));
    } else {
      // Replay the knockouts from the Round of 16. Each round's winner that
      // the player later meets, and the team they face next, are forced
      // through, so an eliminated team never comes back and the next
      // opponent always appears in the round shown.
      let alive = themes.map(t => t.slug);
      for (let r = 3; r <= s; r++) {
        const rng = rngFor(r);
        const forced = new Set();
        if (r === s) {
          if (known(session.next_opponent_slug)) forced.add(session.next_opponent_slug);
        } else if (known(played[r + 1])) {
          forced.add(played[r + 1]);
        }
        if (r < s && known(session.next_opponent_slug)) forced.add(session.next_opponent_slug);
        const pool = alive.filter(sl => sl !== me && sl !== played[r]);
        const { pairs, bye } = pairPool(rng, pool, [...forced]);
        const ties = pairs.map(([a, b]) => knockoutTie(rng, a, b, forced));
        alive = [me, ...ties.map(t => t.winner)].concat(bye ? [bye] : []);
        if (r === s) roundTies = ties;
      }
    }

    const nextOpp = session.next_opponent_slug;
    const forcedTie = s >= 3 && known(nextOpp)
      ? roundTies.find(t => t.a === nextOpp || t.b === nextOpp) : null;
    const shown = (forcedTie ? [forcedTie, ...roundTies.filter(t => t !== forcedTie)] : roundTies).slice(0, 3);

    const themeBySlug = {};
    themes.forEach(t => { themeBySlug[t.slug] = t; });
    const nameOf = sl => (themeBySlug[sl] ? themeBySlug[sl].country_name : sl);

    // One headline per other match shown, from the events that match allows.
    // Each carries a short tag so the round-up reads like a news ticker, and
    // no tag is reused within a round-up, so every match gets its own story.
    const hrng = seededRng(seedBase + s + '|news');
    const usedTags = new Set();
    const headlines = shown.map(tie => {
      const draw = !tie.winner;
      const wName = nameOf(tie.winner);
      const lName = nameOf(tie.winner === tie.a ? tie.b : tie.a);
      const margin = Math.abs(tie.sa - tie.sb);
      const level = tie.sa === tie.sb;
      const pens = tie.note.indexOf('Pens') === 0;
      const first = draw ? (hrng() < 0.5 ? tie.a : tie.b) : null;
      const other = draw ? (first === tie.a ? tie.b : tie.a) : null;
      const opts = [];
      if (pens) opts.push({ tag: 'Penalties', tone: 'gold', text: `${wName}'s keeper saved the decisive penalty against ${lName}.` });
      if (tie.note === 'After extra time') opts.push({ tag: 'Extra time', tone: 'gold', text: `${wName} won it in extra time against ${lName}.` });
      if (!tie.note && !draw && margin === 1) opts.push({ tag: 'Stoppage time', tone: 'gold', text: `${wName} snatched a stoppage-time winner against ${lName}.` });
      if (draw) opts.push({ tag: 'VAR', tone: 'gold', text: `${nameOf(tie.a)} had a late winner ruled out against ${nameOf(tie.b)}.` });
      else if (!tie.note && margin === 1) opts.push({ tag: 'VAR', tone: 'gold', text: `${lName} had a late equaliser ruled out against ${wName}.` });
      if (draw) {
        opts.push({ tag: 'Red card', tone: 'red', text: `${nameOf(first)} finished with ten men after a red card against ${nameOf(other)}.` });
      } else {
        opts.push({ tag: 'Red card', tone: 'red', text: `${lName} finished with ten men after a red card against ${wName}.` });
      }
      if (!draw && !level) opts.push({ tag: 'Own goal', tone: 'red', text: `An own goal from ${lName} handed ${wName} the win.` });
      const kx = draw ? nameOf(first) : lName;
      const ky = draw ? nameOf(other) : wName;
      const kyScore = draw ? tie.sa : (tie.winner === tie.a ? tie.sa : tie.sb);
      opts.push({ tag: 'Keeper error', tone: 'red', text: kyScore >= 1
        ? `${kx}'s keeper let a soft shot slip through against ${ky}.`
        : `${kx}'s keeper dropped a cross but ${ky} could not punish it.` });
      if (level && tie.sa >= 1) opts.push(pens
        ? { tag: 'Late equaliser', tone: 'gold', text: `${lName} forced penalties with a late equaliser against ${wName}.` }
        : { tag: 'Late equaliser', tone: 'gold', text: `${nameOf(first)} grabbed a late equaliser to draw with ${nameOf(other)}.` });
      if (!draw && margin >= 3) opts.push({ tag: 'Heavy defeat', tone: 'red', text: `${lName} were beaten heavily by ${wName}.` });
      if (s >= 4 && !draw) opts.push({ tag: 'Unbeaten run', tone: 'gold', text: `${wName} kept their unbeaten knockout run going against ${lName}.` });
      const fresh = opts.filter(o => !usedTags.has(o.tag));
      const pool = fresh.length ? fresh : opts;
      const pick = pool[Math.floor(hrng() * pool.length)];
      usedTags.add(pick.tag);
      return pick;
    });

    return {
      s,
      mine: known(played[s]) ? { a: me, b: played[s], sa: 1, sb: 0, winner: me, note: '' } : null,
      shown, headlines, themeBySlug,
    };
  }

  function renderRoundup(model, next) {
    const { s, mine, shown, headlines, themeBySlug } = model;
    const knockout = s >= 3;
    const palette = knockout ? KNOCKOUT_PALETTES[s] : null;
    const accent = palette ? palette.accent : '#fbbf24';
    const badgeBg = palette ? palette.accent : '#fbbf24';
    const badgeText = palette === KNOCKOUT_PALETTES[6] ? '#1a1423' : '#0a0a0f';
    const winBg = hexToRgba(accent, 0.18);
    const meSlug = mine ? mine.a : null;

    const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const nameOf = sl => (themeBySlug[sl] ? themeBySlug[sl].country_name : sl);
    const flag = sl => {
      const t = themeBySlug[sl];
      return crestHtml(sl, t ? t.country_name : sl, 'flag-mini', t ? t.accent_colour : '#444') || `<span class="flag-mini" role="img" aria-label="${esc(t ? t.country_name : sl)}" style="background:${flagBg(sl, t ? t.accent_colour : '#444')};"></span>`;
    };
    // Beats, in ms: each match lands, its rows fill in, the winner lights up,
    // then its team flies into the next-round column.
    const STEP = 420, ROW = 130, WIN = 300, FLY = 500;
    const rowHtml = (sl, score, isWinner, delay, winDelay) => {
      const style = isWinner
        ? ` style="--ru-win-bg:${winBg};--ru-accent:${accent};--ru-win-d:${winDelay}ms;--ru-shine-d:${winDelay + 120}ms;"`
        : '';
      return `<div class="ru-row${isWinner ? ' win' : ''}"${style}>${flag(sl)}` +
        `<span class="ru-name">${esc(nameOf(sl))}${sl === meSlug ? '<span class="ru-you">You</span>' : ''}</span>` +
        `<span class="ru-score" data-final="${score}" data-d="${delay}">${score}</span></div>`;
    };
    const matchHtml = (tie, i) => {
      const delay = i * STEP;
      const rowDelay = delay + ROW;
      const winDelay = delay + WIN;
      const chip = knockout && tie.winner
        ? `<span class="ru-line" style="--ru-d:${delay + FLY - 60}ms;"></span>` +
          `<div class="ru-next" style="color:${accent};--ru-d:${delay + FLY}ms;">` +
          `${flag(tie.winner)}<span class="ru-next-name">${esc(nameOf(tie.winner))}</span></div>`
        : '';
      return `<div class="ru-match${tie === mine ? ' mine' : ''}" style="--ru-d:${delay}ms;">
        <div class="ru-box">
          ${rowHtml(tie.a, tie.sa, tie.winner === tie.a, rowDelay, winDelay)}
          ${rowHtml(tie.b, tie.sb, tie.winner === tie.b, rowDelay, winDelay)}
          ${tie.note ? `<div class="ru-note" style="animation:ru-news-in 0.35s ease ${winDelay + 140}ms both;">${esc(tie.note)}</div>` : ''}
        </div>${chip}
      </div>`;
    };

    const matches = (mine ? [mine] : []).concat(shown);
    const newsDelay = matches.length * STEP + 140;

    const el = document.createElement('div');
    el.className = 'result-overlay';
    el.style.cssText = 'position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);';
    el.innerHTML = `
      <div class="result-card roundup-card" role="dialog" aria-modal="true" aria-label="Round-up" style="--ru-accent:${accent};">
        <div class="ru-bar"></div>
        <div class="ru-top">
          <div class="ru-title">Round-up</div>
          <div class="ru-stage" style="background:${badgeBg};color:${badgeText};">${esc(stageName(s))}</div>
        </div>
        <div class="ru-head"><span>Results</span>${knockout ? `<span>${esc(stageName(s + 1))}</span>` : ''}</div>
        ${matches.map((t, i) => matchHtml(t, i)).join('')}
        ${headlines.length ? `<div class="ru-news">
          <div class="ru-news-h">Headlines</div>
          <ul>${headlines.map((h, i) =>
            `<li style="--ru-d:${newsDelay + i * 170}ms;"><span class="ru-tag ${h.tone}">${esc(h.tag)}</span><span>${esc(h.text)}</span></li>`
          ).join('')}</ul>
        </div>` : ''}
        <button class="bundle-btn btn-gold ru-continue" style="width:100%;margin-top:14px;">Continue →</button>
      </div>`;
    document.body.appendChild(el);
    const stopScores = playRoundupScores(el);
    const btn = el.querySelector('.ru-continue');
    btn.addEventListener('click', () => { stopScores(); el.remove(); next(); });
    btn.focus();
  }

  // Ticks each score up from 0 as its match lands. The final score is already
  // in the markup, so a device that asks for reduced motion just sees it.
  function playRoundupScores(el) {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const scores = Array.from(el.querySelectorAll('.ru-score[data-final]'))
      .map(s => ({ el: s, final: +s.dataset.final, d: +s.dataset.d }));
    if (reduce || !scores.length) return () => {};
    scores.forEach(s => { s.el.textContent = '0'; });
    const t0 = performance.now();
    let raf = 0;
    const tick = now => {
      let running = false;
      scores.forEach(s => {
        const p = Math.max(0, Math.min(1, (now - t0 - s.d) / 320));
        s.el.textContent = String(Math.round(s.final * (1 - Math.pow(1 - p, 3))));
        if (p < 1) running = true;
      });
      if (running && el.isConnected) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { if (raf) cancelAnimationFrame(raf); };
  }

  // Fresh session: the client's copy predates the win's played_slugs / next opponent.
  async function showRoundup(next) {
    let session = null;
    try {
      const r = await api('GET', '/api/session');
      if (r.ok) session = (await r.json()).session;
    } catch (e) { session = null; }
    if (!session || !session.my_team_slug || !Array.isArray(state.themes) || !state.themes.length ||
        !(session.stage_idx >= 1) || session.stage_idx >= 7) {
      return next();
    }
    let model = null;
    try { model = buildRoundup(session, state.themes); } catch (e) { model = null; }
    if (!model) return next();
    renderRoundup(model, next);
  }
  window.showRoundup = showRoundup;

  window.handleInterstitial = function() {
    const result = state.pendingResult || {};
    const type = result.interstitial || '';
    document.querySelectorAll('.result-overlay').forEach(e => e.remove());
    stopConfetti();

    if (type === 'final_win') {
      renderVictoryStadium(result);
    } else if (type === 'through_to_knockouts') {
      // Show interstitial then lobby
      const el = document.createElement('div');
      el.className = 'result-overlay';
      el.style.cssText = 'position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);';
      el.innerHTML = `<div class="result-card"><div style="font-size:2rem;">🎉</div>

  // ═══════════════════════════════════════════════════════════════
  // PRICING HELPER — mirrors server-side pricingForStage logic
  // ═══════════════════════════════════════════════════════════════
  function pricingForStage(stageIdx) {
    let perShot;
    if (stageIdx <= 2) perShot = 6.5;
    else if (stageIdx <= 4) perShot = 4;
    else if (stageIdx === 5) perShot = 2.75;
    else perShot = 2;
    const bundle2Cost = Math.round(perShot * 2 * 0.97);
    const bundle8Cost = Math.round(perShot * 8 * 0.85);
    const bundle16Cost = Math.round(perShot * 16 * 0.80);
    return { perShot, bundle2: bundle2Cost, bundle8: bundle8Cost, bundle16: bundle16Cost };
  }

  window.buyBundle = async function(size) {
    if (state.walletBalance === undefined || state.walletBalance === null) {
      showToast('Wallet not initialized — please reload', 3000);
      return;
    }

    // Prevent purchasing if player has shots remaining
    const credRemaining = state.credits ? parseInt(state.credits.credits_remaining) : 0;
    if (credRemaining > 0) {
      showToast('You must use your remaining shots first', 3000);
      return;
    }

    const r = await api('POST', `/api/games/${state.game.id}/bundle`, { bundle_size: size });
    if (!r.ok) {
      const e = await r.json().catch(()=>({}));
      if (r.status === 402 || e.error === 'Insufficient balance') {
        showToast('Not enough tokens — try a smaller bundle below 👇', 3000);
      } else {
        showToast(e.error || 'Bundle purchase failed');
      }
      return;
    }
    try {
      const d = await r.json();
      state.credits = { id: d.session.id, credits_remaining: d.credits_remaining, tokens_per_credit: d.session.tokens_per_credit };
      state.regularSessionId = d.session.id;
      state.walletBalance = d.wallet_balance;
      updateHud();
      updateCreditsDisplay();
      showToast(t('game.shots_loaded', {size: size}), 2000);
    } finally {
      Sound.playSuccesspurchase();
    }
  };

            ${[['Group',16,13,'~14%'],['Knockout',25,8,'~13%'],['Semi',36,5.5,'~13%'],['Final',49,4,'~12%']].map(([s,n,p,m]) => `<tr><td style="padding:4px 6px;color:#ccc;">${s}</td><td style="text-align:right;padding:4px 6px;color:#ccc;">${n}</td><td style="text-align:right;padding:4px 6px;color:#fbbf24;font-family:'Space Mono',monospace;">${p}</td><td style="text-align:right;padding:4px 6px;color:#93c5fd;">${m}</td></tr>`).join('')}
          </table>
          <p>Bundles prepay 8 or 16 shots at the same stage rate (no per-shot discount), so every purchase option holds the same ~12.5% margin.</p>

          <h3>Captain's Pot — Odds-Indexed Floors</h3>
          <p>The pot reseeds to a stage floor F = K·N (K = 6.25): group 100, knockout 160, semi 230, final 320 (rounded up to tidy figures). Expected house jackpot cost per fresh board is F/N ≈ 6.25–6.5 tokens — <strong>roughly constant across every stage</strong>, which is what keeps the long-run margin steady.</p>
          <ul>
            <li>Top-ups derived from the change in odds: +60 entering knockouts, +70 entering the semi, +90 entering the final.</li>
            <li>Jackpot odds per fresh board: group 1/16, knockout 1/25, semi 1/36, final 1/49.</li>
            <li>Reseed on win uses the floor of the winning stage; the pot's anchor tier resets so it can climb again.</li>
          </ul>

          <h3>🔐 ZK Enhancement (Future)</h3>
          <p>Currently players must trust that the hidden object is placed before the game starts and never moved. A Zero-Knowledge proof layer could make this <strong>verifiably fair</strong> without revealing the answer:</p>
          <ul>
            <li>At game creation, the server commits to the ball position using a hash: <code>commit = hash(position, salt)</code>. The commitment is stored publicly (on-chain or in the game record).</li>
            <li>At game end, the server reveals position + salt. Anyone can verify <code>hash(position, salt) == commit</code>, proving the position was fixed from the start.</li>
            <li>A ZK proof goes further: the server can prove it knows a valid pre-image for the commitment <em>without</em> revealing the position mid-game — so the proof is verifiable in real time, not just after the fact.</li>
            <li><strong>Noir</strong> (by Aztec) is a Rust-like language for writing ZK circuits that compile to both native provers and browser-runnable WASM. It would be the natural fit here: write the "ball is at position P under commitment C" circuit in Noir, generate a proof server-side per game, verify client-side in the browser before the player makes their first guess.</li>
          </ul>
          <p>This upgrade would turn the game's fairness from a trust assumption into a cryptographic guarantee.</p>

          <h3>📋 To Do: Aztec Noir Proof Integration</h3>
          <p><strong>Status: Not yet implemented</strong></p>
          <p>Plan to record tournament game results on-chain via Aztec with Noir ZK proofs:</p>
          <ul>
            <li><strong>Proof generation:</strong> When a game is created, generate a Noir proof in the background that commits to the ball position (tournament_id, game_number, username, ball_position, stage_idx, client_timestamp). Proof stored locally with status 'generating' → 'pending'.</li>
            <li><strong>Proof submission:</strong> On game win, submit the proof to Aztec testnet contract. Status updates to 'pending', then 'confirmed' once on-chain.</li>
            <li><strong>Viewing proofs:</strong> New pages: <code>#player/games/:username</code> (player's tournament games with proof links) and <code>#on-chain-proofs</code> (global proof registry, linked from footer).</li>
            <li><strong>Setup required:</strong> Aztec testnet account, private key, deployed contract address; Noir compiler integration in build; environment variables (AZTEC_RPC_URL, AZTEC_CONTRACT_ADDRESS, AZTEC_WALLET_PRIVATE_KEY, AZTEC_ACCOUNT_ADDRESS).</li>
            <li><strong>Circuit:</strong> Noir circuit at <code>circuits/game_proof.nr</code> that verifies game fields and outputs a commitment hash.</li>
            <li><strong>Database:</strong> New table <code>on_chain_records</code> (game_id, tournament_id, game_number, username, ball_position, stage_idx, proof_status, aztec_tx_hash, proof_commitment).</li>
          </ul>
          <p>Proof generation happens silently during gameplay; submission is non-blocking on win. Game IDs formatted as <code>000001-1</code> (tournament_id-game_number).</p>
        </div>
      </div>
    </div>`;
  }

  // ═══════════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════════
  async function init() {
    // Testing mode is gone: clear the stale flag left in older browsers
    try { localStorage.removeItem('testingMode'); } catch(_) {}

    // Paint the lobby's loading shell at once, so the header and placeholders
    // show while i18n, themes and the session are fetched.
    if (!location.hash || location.hash === '#lobby') route();

    // Initialize i18n system
    try {
      await window.initI18n();
    } catch (err) {
      console.error('i18n init failed:', err);
    }

    // Load themes globally for use across screens
    try {
      const r = await api('GET', '/api/themes');
      if (r.ok) { const d = await r.json(); state.themes = d.themes || []; }
    } catch {}

    // On load: check session then route
    try {
      const r = await api('GET', '/api/session');
      if (r.ok) {
        const d = await r.json();
        state.session = d.session;
        state.walletBalance = d.wallet_balance || 1000;
        state.potBalance = d.captain_pot_balance || 100;
        state.prevPotBalance = state.potBalance;
        // Seed from the server's most recent win so a fresh page load doesn't
        // fire a phantom "just won" broadcast on the first poll.
        state.potLastWonAt = d.last_won_at || null;

        // If active game in session, go straight there
        if (d.session && d.session.current_game_id && !d.session.session_complete) {
          navigate('#game/' + d.session.current_game_id);
          return;
        }
      }
    } catch {}

    route();

  }

  init();
  </script>
