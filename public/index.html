  <title>GOAL! Champions League Edition</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1/dist/confetti.browser.min.js"></script>
  <script src="/i18n.js"></script>

  <style>
    :root {
      --glass-line: rgba(150,160,255,.24);
      --accent: #6d7bff;
      --accent-soft: rgba(109,123,255,0.33);
      --gold: #ffce4a;
    }
    * { box-sizing: border-box; }
    html { background: #0a0a0f; }
    body { font-family: 'Space Grotesk', sans-serif; background: transparent; color: #f0f0f5; margin: 0; min-height: 100vh; }

    /* Full-screen flag background (game board only — set via JS) */
    .bg {
      position: fixed; inset: 0; z-index: -2;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      --overlay-opacity: 1;
    }
    .bg::after {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(8,9,20,0.0) 0%, rgba(8,9,20,0.35) 100%),
        linear-gradient(180deg, rgba(7,7,16,0.22) 0%, rgba(7,7,16,0.05) 50%, rgba(7,7,16,0.28) 100%);
      opacity: var(--overlay-opacity);
      transition: opacity 0.45s;
    }
    .font-dm { font-family: 'DM Sans', sans-serif; }
    .font-mono-stat { font-family: 'Space Mono', monospace; }
    .font-8bit { font-family: 'Press Start 2P', monospace; }

    /* Lobby hero */
    .hero-title { font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: clamp(2.4rem, 10vw, 3.6rem); letter-spacing: -1.5px; line-height: 1; margin: 0; }
    .hero-go { color: #f0f0f5; }
    .hero-al { color: #e23b4e; }
    .hero-edition { display: block; font-family: 'Space Mono', monospace; font-weight: 700; font-size: clamp(0.7rem, 3vw, 1rem); letter-spacing: 0.22em; color: #fbbf24; text-transform: uppercase; margin-top: 5px; }
    .hero-sub { font-family: 'Space Grotesk', sans-serif; color: #9ca3af; font-size: 0.75rem; margin-top: 4px; margin-bottom: 8px; }

    /* Nation flag card */
    .nation-card {
      border-radius: 12px; overflow: hidden; cursor: pointer; position: relative;
      border: 2px solid rgba(255,255,255,0.08);
      transition: transform 0.18s cubic-bezier(.22,1,.36,1), box-shadow 0.18s, border-color 0.18s;
      aspect-ratio: 3/2; background: #11131c;
    }
    .nation-card:hover { transform: translateY(-6px) scale(1.02); box-shadow: 0 0 0 2px #fbbf24, 0 12px 32px rgba(251,191,36,0.35); border-color: #fbbf24; }
    .nation-card:active { transform: translateY(-2px) scale(0.99); }
    .nation-card .flag-area { position: absolute; inset: 0; overflow: hidden; }
    .nation-card .flag-area img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .nation-card .flag-area::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.78) 100%); z-index: 1; }
    .nation-card .name-area { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 4px; text-align: center; color: #fff; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: clamp(8px, 2.2vw, 10px) !important; line-height: 1.2; text-shadow: 0 1px 4px rgba(0,0,0,0.9); z-index: 2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* HUD chips */
    .hud-chip {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 6px 12px; font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem; color: #aaa; text-align: center; flex: 1;
    }
    .hud-chip .val { font-family: 'Space Mono', monospace; font-size: clamp(0.65rem, 4vw, 1rem); color: #f0f0f5; font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pot-chip {
      border-color: rgba(251,191,36,0.5) !important;
      box-shadow: 0 0 8px rgba(251,191,36,0.2);
    }
    .pot-chip .val { font-size: 1rem !important; color: #fbbf24 !important; }

    @keyframes pot-heartbeat {
      0%, 100% { box-shadow: 0 0 8px rgba(251,191,36,0.2); }
      50% { box-shadow: 0 0 20px rgba(251,191,36,0.6), 0 0 40px rgba(251,191,36,0.2); }
    }
    .pot-heartbeat { animation: pot-heartbeat 3s ease-in-out infinite; }

    @keyframes pot-pulse-ring {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    /* Refund coin flight — shots paid back after winning the Final */
    .refund-coin-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .refund-coin {
      position: absolute; width: 18px; height: 18px; border-radius: 50%;
      background: #fbbf24; border: 2px solid #f59e0b;
      box-shadow: 0 0 8px rgba(251,191,36,0.6);
      color: #0a0a0f; font-family: 'Space Mono', monospace; font-weight: 700;
      font-size: 9px; line-height: 14px; text-align: center;
      animation: refund-coin-wind 1.4s cubic-bezier(.4,.1,.4,1) forwards;
      will-change: transform, opacity;
    }
    .refund-coin span { display: inline-block; animation: refund-coin-flutter 0.35s ease-in-out infinite alternate; }
    @keyframes refund-coin-wind {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
      35%  { transform: translate(calc(var(--tx) * 0.3 + var(--sway)), calc(var(--ty) * 0.25)) scale(1.05) rotate(-12deg); opacity: 1; }
      70%  { transform: translate(calc(var(--tx) * 0.75 - var(--sway)), calc(var(--ty) * 0.7)) scale(0.9) rotate(10deg); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.4) rotate(0deg); opacity: 0; }
    }
    @keyframes refund-coin-flutter {
      from { transform: rotateY(0deg) translateY(0); }
      to   { transform: rotateY(180deg) translateY(-1px); }
    }
    .refund-summary { font-family: 'Space Mono', monospace; font-size: 0.85rem; color: #fbbf24; margin-bottom: 8px; }
    @keyframes refund-glow-pulse {
      0%, 100% { box-shadow: 0 0 8px rgba(251,191,36,0.2); }
      50% { box-shadow: 0 0 20px rgba(251,191,36,0.6), 0 0 40px rgba(251,191,36,0.2); }
    }
    .hud-chip.refund-glow { animation: refund-glow-pulse 0.6s ease; }
    @media (prefers-reduced-motion: reduce) {
      .refund-coin-layer, .refund-coin { display: none; }
    }

    /* Game board — board dominates, all 64 tiles always visible, no scroll */
    .board-zone {
      flex: 1 1 auto; min-height: auto; position: relative;
      display: flex; align-items: center; justify-content: center; padding: 12px 2px 12px 2px;
    }

    /* Three-layer board stack — mobile-first: near-full width */
    .board-wrap {
      position: relative;
      border-radius: 14px;
      overflow: visible;
      aspect-ratio: 3/4;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 0 0 3px rgba(0,0,0,0.6),
        0 20px 60px -10px rgba(0,0,0,0.95),
        inset 0 1px 0 rgba(255,255,255,0.06);
      width: min(96vw, calc(100vh - 185px));
      width: min(96vw, calc((100svh - 140px) * 3/4));
      max-height: none;
    }
    @media (min-width: 481px) {
      .board-wrap { width: min(400px, calc(100vh - 185px)); width: min(400px, calc((100svh - 140px) * 3/4)); }
      #game-body { max-width: 440px; margin: 0 auto; }
    }
    /* Full-height game container using small viewport height to stay within visible area on mobile */
    .game-screen { display: flex; flex-direction: column; height: 100vh; height: 100svh; overflow: hidden; position: relative; }

    /* Stadium backdrop — scenery only, always behind the board and never interactive */
    .stadium {
      position: absolute; inset: 0; z-index: 0;
      pointer-events: none; overflow: hidden;
      transition: opacity 0.45s;
    }
    .stadium.is-hidden { opacity: 0; }
    .stadium-stands {
      position: absolute; left: 0; right: 0; top: 0; height: 24%;
      background:
        linear-gradient(180deg, rgba(9,14,20,0) 58%, rgba(9,14,20,0.92) 100%),
        radial-gradient(ellipse 38% 60% at 16% 0%, rgba(255,255,232,0.42), rgba(255,255,232,0) 72%),
        radial-gradient(ellipse 38% 60% at 84% 0%, rgba(255,255,232,0.42), rgba(255,255,232,0) 72%),
        url('/images/stadium/stands.svg') center bottom / auto 100% repeat-x,
        #0d1020;
    }
    .stadium-stands::after {
      content: ''; position: absolute; inset: 0;
      background: var(--accent-soft);
      opacity: 0.3;
    }
    .stadium-pitch {
      position: absolute; left: 0; right: 0; top: 22.5%; bottom: 0;
      --stripe: repeating-linear-gradient(90deg, #1e5f28 0 8%, #267130 8% 16%);
      background:
        radial-gradient(ellipse 115% 85% at 50% 28%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.58) 100%),
        url('/images/stadium/pitch-lines.svg') center / 100% 100% no-repeat,
        var(--stripe);
    }
    .stadium-goal {
      position: absolute; left: 50%; top: -10%; transform: translateX(-50%);
      width: min(70%, 800px); height: 26%;
      background: url('/images/stadium/goal.svg') center / 100% 100% no-repeat;
    }
    @media (max-width: 480px) {
      .stadium-pitch { --stripe: repeating-linear-gradient(180deg, #1e5f28 0 7%, #267130 7% 14%); }
      /* The board covers the goal on phones; its fine net lines otherwise show
         through the 2px tile gaps and read as noise. */
      .stadium-goal { display: none; }
    }
    .portrait {
      position: absolute; inset: 0; z-index: 0;
      display: block; width: 100%; height: 100%;
      background-size: contain; background-position: center;
      background-repeat: no-repeat;
    }
    .board {
      position: absolute; inset: 0; z-index: 2;
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 2px;
      perspective: 1000px;
    }
    .reveal {
      position: absolute; inset: 0; z-index: 6;
      display: none; pointer-events: none;
    }

    /* Gem tiles */
    .tile {
      position: relative;
      cursor: pointer;
      aspect-ratio: 3/4;
      background: linear-gradient(150deg, #2b3068, #13152f);
      box-shadow:
        inset 0 0 0 1px rgba(150,160,255,.18),
        inset 0 1px 0 rgba(255,255,255,.10);
      transition: filter .15s, transform .1s;
      overflow: hidden;
    }
    .tile::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.16) 50%, transparent 60%);
      pointer-events: none;
    }
    .tile::after {
      content: "";
      position: absolute; inset: 0;
      box-shadow: inset 0 0 0 2px var(--accent-soft), inset 0 0 20px -2px var(--accent-soft);
      opacity: 0;
      transition: .16s;
      pointer-events: none;
    }
    .tile:not(.open):hover { filter: brightness(1.3) saturate(1.4); z-index: 3; }
    .tile:not(.open):hover::after { opacity: 1; }
    .tile:not(.open):active { transform: scale(.94); }
    .tile.open { cursor: default; background: transparent; box-shadow: none; pointer-events: none; }
    .tile.open::before { opacity: 0; }

    /* Match Event squares: uncovered graphic replaces the plain portrait slice */
    .tile.tile-event {
      background-color: rgba(10, 10, 30, 0.82);
      background-size: 78% 78%;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: inset 0 0 0 1px rgba(255, 215, 0, 0.45);
    }
    .tile.tile-event.good { box-shadow: inset 0 0 0 1px rgba(52, 211, 153, 0.55), inset 0 0 14px -2px rgba(52, 211, 153, 0.4); }
    .tile.tile-event.bad { box-shadow: inset 0 0 0 1px rgba(239, 68, 68, 0.55), inset 0 0 14px -2px rgba(239, 68, 68, 0.4); }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      15% { transform: translateX(-6px); }
      30% { transform: translateX(6px); }
      45% { transform: translateX(-5px); }
      60% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
      90% { transform: translateX(3px); }
    }
    .shake { animation: shake 0.8s ease-in-out; }

    /* Miss guess: expose the empty square with a 3D flip, then gravity-fall
       off the bottom of the screen. Tilt/drift come from --fall-tilt and
       --fall-drift set per tile before the animation starts. */
    @keyframes tile-expose-fall {
      0%   { transform: perspective(500px) rotateY(0deg) translateY(0); filter: brightness(1) saturate(1); opacity: 1; animation-timing-function: cubic-bezier(.4,0,.2,1); }
      7%   { filter: brightness(2.6) saturate(1.6); animation-timing-function: cubic-bezier(.4,0,.2,1); }
      26%  { transform: perspective(500px) rotateY(80deg) translateY(0) rotateZ(0deg); opacity: .45; filter: brightness(1.15); animation-timing-function: cubic-bezier(.5,0,.85,.4); }
      100% { transform: perspective(500px) rotateY(100deg) translateY(120vh) translateX(var(--fall-drift, 0px)) rotateZ(var(--fall-tilt, 14deg)); opacity: 0; }
    }
    .tile-fall { animation: tile-expose-fall 1.1s forwards; pointer-events: none; }
    .tile-fall.reveal-fast { animation-duration: .55s !important; }

    /* Win sequence animations */
    @keyframes fadeout { 0% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes blackfade { 0% { opacity: 0; } 100% { opacity: 0.9; } }

    /* Match-start square spawn animation */
    @keyframes tile-spawn {
      0% { opacity: 0; transform: scale(0.8); filter: drop-shadow(0 0 8px gold); }
      60% { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 12px gold); }
      100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 0px gold); }
    }
    .tile-spawn { animation: tile-spawn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* Full-board sparkle flash when all tiles finish spawning */
    @keyframes tile-sparkle-flash {
      0% { filter: drop-shadow(0 0 0px gold); transform: scale(1); }
      50% { filter: drop-shadow(0 0 20px gold); transform: scale(1.08); }
      100% { filter: drop-shadow(0 0 0px gold); transform: scale(1); }
    }
    .tile-sparkle-flash { animation: tile-sparkle-flash 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* Match Event square fade: 2s after the graphic appears the tile fades out,
       leaving the portrait slice visible like an empty open square. Two-class
       selector so it beats .tile-spawn / .tile-sparkle-flash. */
    .tile.tile-event-fade { animation: fadeout 0.6s ease-out forwards; pointer-events: none; }

    /* Tile exit animation for goal celebration */
    @keyframes tile-exit-spin-fade {
      0% { transform: scale(1) rotateZ(0deg); opacity: 1; filter: drop-shadow(0 0 8px gold); }
      50% { transform: scale(1.1) rotateZ(180deg); opacity: 0.7; filter: drop-shadow(0 0 20px gold); }
      100% { transform: scale(0) rotateZ(360deg); opacity: 0; filter: drop-shadow(0 0 0px gold); }
    }
    .tile-exit { animation: tile-exit-spin-fade 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

    /* Penalty square jewel burst animation */
    @keyframes penalty-jewel-emerge {
      0% {
        transform: scale(0) rotateZ(0deg);
        opacity: 0;
        filter: brightness(2) drop-shadow(0 0 0px #00ffff);
      }
      25% {
        transform: scale(0.4) rotateZ(-45deg);
        opacity: 1;
        filter: brightness(3) drop-shadow(0 0 12px #00ffff) drop-shadow(0 0 24px #ffce4a);
      }
      60% {
        transform: scale(2.5) rotateZ(45deg);
        opacity: 0.9;
        filter: brightness(2) drop-shadow(0 0 24px #00ffff) drop-shadow(0 0 40px #ffce4a);
      }
      100% {
        transform: scale(2.5) rotateZ(90deg);
        opacity: 1;
        filter: brightness(1.6) drop-shadow(0 0 20px #00ffff) drop-shadow(0 0 32px #ffce4a);
      }
    }

    @keyframes penalty-glow-ring {
      0% {
        transform: scale(0.8);
        opacity: 1;
        box-shadow: 0 0 0px rgba(0, 255, 255, 0.8), 0 0 0px rgba(255, 206, 74, 0.6);
      }
      50% {
        transform: scale(2.2);
        opacity: 0.6;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), 0 0 40px rgba(255, 206, 74, 0.3);
      }
      100% {
        transform: scale(4);
        opacity: 0;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.1), 0 0 60px rgba(255, 206, 74, 0);
      }
    }

    .penalty-jewel {
      animation: penalty-jewel-emerge 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #00ffff, #0066ff);
      pointer-events: none;
      z-index: 60;
    }

    .penalty-glow-ring {
      animation: penalty-glow-ring 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 59;
    }

    /* Football goal spin animation */
    @keyframes goal-spin {
      0% { transform: rotateZ(0deg); }
      100% { transform: rotateZ(var(--spin-amount)); }
    }
    .goal-spin { animation: goal-spin var(--spin-duration, 2s) linear forwards; }

    /* 80s GOAL text animations */
    @keyframes goal-neon-flicker {
      0% { color: #ff006e; text-shadow: 0 0 10px #ff006e, 0 0 20px #ff006e; }
      20% { color: #00f5ff; text-shadow: 0 0 10px #00f5ff, 0 0 20px #00f5ff; }
      40% { color: #ffbe0b; text-shadow: 0 0 10px #ffbe0b, 0 0 20px #ffbe0b; }
      60% { color: #ff006e; text-shadow: 0 0 10px #ff006e, 0 0 20px #ff006e; }
      80% { color: #00f5ff; text-shadow: 0 0 10px #00f5ff, 0 0 20px #00f5ff; }
      100% { color: #ffbe0b; text-shadow: 0 0 10px #ffbe0b, 0 0 20px #ffbe0b; }
    }
    .goal-neon-flicker { animation: goal-neon-flicker 1.2s ease-in-out forwards; }

    @keyframes goal-marquee {
      0% { transform: translateX(-100%); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }
    .goal-marquee { animation: goal-marquee 2.5s linear forwards; overflow: hidden; white-space: nowrap; }

    @keyframes goal-stack-pulse {
      0% { transform: scale(0.8); opacity: 0; filter: blur(2px); }
      30% { transform: scale(1.1); opacity: 1; filter: blur(0); }
      60% { transform: scale(1); opacity: 1; }
      85% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(0.9); opacity: 0; }
    }
    .goal-stack-pulse { animation: goal-stack-pulse 2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

    /* Game HUD — ultra compact 4-chip row (scoped to game screen) */
    .game-hud { display: flex; gap: 4px; padding: 2px 8px; background: rgba(0,0,0,0.48); border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
    .game-hud .hud-chip { padding: 2px 5px !important; border-radius: 6px !important; font-size: 7.5px !important; line-height: 1.1; }
    .game-hud .hud-chip .val { font-size: clamp(9px, 2.5vw, 12px) !important; }
    .game-hud .pot-chip { box-shadow: 0 0 8px rgba(251,191,36,0.18) !important; }
    .game-hud .pot-chip .val { font-size: clamp(9px, 2.5vw, 12px) !important; color: #fbbf24 !important; }

    /* Nation strip — single tight row */
    .nation-strip { font-family: 'DM Sans', sans-serif; font-size: 0.68rem; color: #bbb; display: flex; align-items: center; gap: 5px; padding: 1px 8px; background: rgba(0,0,0,0.38); border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; min-height: 22px; }
    .flag-mini { width: 18px; height: 12px; border-radius: 2px; display: inline-block; flex-shrink: 0; object-fit: cover; vertical-align: middle; }
    /* Club crest on a light plate; the two-colour split shows if the image fails. */
    .club-crest { display: inline-flex; align-items: center; justify-content: center; background: #f4f4f7; overflow: hidden; box-sizing: border-box; flex-shrink: 0; }
    .club-crest img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .club-crest.crest-failed { padding: 0; }
    .crest-hero { width: 80px; height: 54px; border-radius: 6px; padding: 5px; box-shadow: 0 4px 16px rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.15); }
    .flag-mini.club-crest { padding: 1px; }
    .nation-card .flag-area .club-crest { position: absolute; inset: 0; padding: 8px 8px 22px; }
    .nation-card .flag-area .club-crest img { position: static; object-fit: contain; }
    .crest-win { width: 34px; height: 23px; border-radius: 3px; box-shadow: 0 2px 8px rgba(0,0,0,0.5); margin: 0 6px; vertical-align: middle; }

    /* Game footer — compact controls + hint */
    .game-footer { flex-shrink: 0; padding: 2px 8px 3px; background: rgba(0,0,0,0.55); border-top: 1px solid rgba(255,255,255,0.08); }
    .game-footer .bundle-btn { padding: 0 10px !important; font-size: 0.78rem !important; height: 34px; line-height: 34px; border-radius: 10px !important; }
    .game-footer .credits-chip { padding: 4px 10px !important; font-size: 0.78rem !important; border-radius: 10px !important; }

    /* Mobile: squeeze header, HUD, and nation strip to save height */
    @media (max-width: 480px) {
      header { padding: 4px 12px !important; }
      .game-hud { padding: 1px 6px; }
      .game-hud .hud-chip { padding: 1px 4px !important; font-size: 6.5px !important; }
      .game-hud .hud-chip .val { font-size: 11px !important; }
      .nation-strip { padding: 0px 6px; min-height: 20px; font-size: 0.62rem; gap: 4px; }
      /* Lobby stat boxes on mobile */
      .lobby-stats-row { gap: 6px !important; }
      .lobby-stat-box { padding: 3px 6px !important; min-width: 0; }
      .lobby-stat-box > span:first-child { font-size: 0.6rem !important; }
      .lobby-stat-box .val { font-size: 0.85rem !important; }
      /* Victory stadium on mobile */
      #victory-bg { padding: 16px 12px !important; }
      .result-card { max-width: 100% !important; margin: 0 auto; }
      #display-name-input { font-size: 0.82rem !important; padding: 6px 10px !important; }
      .bundle-btn { font-size: 0.78rem !important; padding: 8px 12px !important; }
      #lobby-body .lobby-kickoff { font-size: 1.05rem !important; padding: 16px !important; }
      #victory-bg > .result-card > div:nth-child(2) { font-size: clamp(0.95rem, 4vw, 1.3rem) !important; word-break: break-word; overflow-wrap: break-word; }
      /* League table on mobile */
      .league-table td { padding: clamp(6px, 1.5vw, 10px) clamp(8px, 2vw, 12px); }
      .league-rank { text-align: center; }
      .league-name { word-break: break-word; overflow-wrap: break-word; }
    }

    /* Controls */
    .bundle-btn {
      font-family: 'DM Sans', sans-serif; font-weight: 700; border: none; border-radius: 12px;
      padding: 10px 18px; cursor: pointer; font-size: 0.85rem; letter-spacing: 0.01em;
      transition: transform 0.12s, box-shadow 0.12s, opacity 0.1s;
    }
    .bundle-btn:hover { transform: scale(1.025); }
    .bundle-btn:active { transform: scale(0.97); }
    .btn-gold { background: linear-gradient(135deg, #ffce4a, #f59e0b); color: #0a0a0f; box-shadow: 0 2px 12px rgba(251,191,36,0.28); }
    .btn-gold:hover { box-shadow: 0 4px 18px rgba(251,191,36,0.42); }
    .btn-green { background: linear-gradient(135deg, #34d399, #059669); color: white; box-shadow: 0 2px 10px rgba(16,185,129,0.25); }
    .btn-red { background: linear-gradient(135deg, #f87171, #ef4444); color: white; }
    .btn-ghost { background: rgba(255,255,255,0.08); color: #d0d0e0; border: 1px solid rgba(255,255,255,0.12); }

    /* Header — transparent so flag image bleeds through; blur keeps text readable */
    header {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: rgba(10,10,15,0.12); backdrop-filter: blur(14px) saturate(1.2);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header-logo-block { display: flex; flex-direction: column; justify-content: center; min-height: 44px; text-decoration: none; line-height: 1.1; }
    .header-logo-title { font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 1.2rem; color: #fbbf24; letter-spacing: -0.5px; }
    .header-logo-sub { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.55rem; color: #fbbf24; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.8; margin-top: 1px; }
    .header-btns { display: flex; align-items: center; gap: 2px; }
    .header-btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 44px; min-height: 44px; box-sizing: border-box;
      font-family: 'DM Sans', sans-serif; font-size: 1rem; padding: 6px 10px;
      background: none; border: none; color: #aaa; cursor: pointer; border-radius: 6px; transition: color 0.15s, background 0.15s;
    }
    .header-btn:hover { color: white; background: rgba(255,255,255,0.08); }
    .header-divider { width: 1px; height: 20px; background: rgba(255,255,255,0.1); margin: 0 2px; }

    /* FAQ hackathon section */
    .faq-hackathon { background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.25); border-radius: 12px; padding: 20px; margin-top: 16px; }
    .faq-hackathon-badge { display: inline-block; background: rgba(251,191,36,0.15); border: 1px solid rgba(251,191,36,0.4); border-radius: 6px; padding: 3px 10px; font-size: 0.72rem; font-weight: 700; color: #fbbf24; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 16px; }
    .faq-hackathon h2 { font-size: 1.1rem; font-weight: 700; color: #fbbf24; margin-bottom: 4px; }
    .faq-hackathon h3 { font-size: 0.95rem; font-weight: 700; color: #93c5fd; margin: 16px 0 8px; }
    .faq-hackathon p, .faq-hackathon li { color: #bbb; line-height: 1.7; font-size: 0.9rem; }
    .faq-hackathon ul { padding-left: 20px; margin: 8px 0; }
    .faq-hackathon pre { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; font-family: 'Space Mono', monospace; font-size: 0.78rem; color: #aaa; overflow-x: auto; }

    /* Toast */
    #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
    .toast { font-family: 'DM Sans', sans-serif; background: rgba(30,30,40,0.97); border: 1px solid rgba(251,191,36,0.4); border-radius: 10px; padding: 12px 20px; color: white; font-size: 0.9rem; animation: toast-in 0.3s ease; max-width: 340px; text-align: center; }
    @keyframes toast-in { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Nudge the shot-purchase buttons when a player taps the board with no shots loaded */
    @keyframes controls-nudge { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
    .controls-nudge { animation: controls-nudge 0.5s ease; }

    /* Win overlay */
    .win-overlay { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
    .board-dim { position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 40; }

    /* Result card */
    .result-card { background: rgba(15,15,25,0.97); border: 1px solid rgba(251,191,36,0.5); border-radius: 16px; padding: 28px; text-align: center; max-width: 340px; width: 90%; box-shadow: 0 0 40px rgba(251,191,36,0.2); max-height: 85vh; overflow-y: auto; position: relative; }
    .result-card .portrait-display { width: 140px; height: 140px; margin: 0 auto 12px; border-radius: 12px; background-size: cover; background-position: center; border: 2px solid rgba(251,191,36,0.4); box-shadow: 0 0 20px rgba(251,191,36,0.2); }
    @media (max-width: 480px) {
      .result-card { padding: 20px; width: 95%; max-width: 100%; }
    }

    /* Round-up card — how the rest of the round went, between matches.
       Every element rests in its finished state; the animation only decides
       how it gets there, so reduced motion simply shows the finished card. */
    .roundup-card { max-width: 460px; padding: 22px 20px 20px; overflow-x: hidden; animation: ru-card-in 0.35s ease both; }
    .ru-bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; border-radius: 16px 16px 0 0; background: rgba(255,255,255,0.05); }
    .ru-bar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--ru-accent, #fbbf24), transparent); transform: translateX(-100%); animation: ru-sweep 1.2s ease 0.1s both; }
    .ru-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; text-align: left; }
    .ru-title { font-family: 'DM Sans', sans-serif; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
    .ru-stage { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; font-family: 'DM Sans', sans-serif; font-size: 0.62rem; font-weight: 800; padding: 4px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.1em; }
    .ru-stage::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: ru-pulse 1.3s ease-in-out infinite; }
    .ru-head { display: flex; justify-content: space-between; font-family: 'DM Sans', sans-serif; font-size: 0.6rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; text-align: left; }
    .ru-match { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; animation: ru-match-in 0.5s cubic-bezier(0.2, 0.85, 0.3, 1.15) var(--ru-d, 0ms) both; }
    .ru-box { flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; overflow: hidden; text-align: left; background: rgba(255,255,255,0.02); }
    .ru-match.mine .ru-box { border-color: rgba(251,191,36,0.45); box-shadow: 0 0 18px rgba(251,191,36,0.12); }
    .ru-row { position: relative; overflow: hidden; display: flex; align-items: center; gap: 6px; padding: 5px 9px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; color: #aaa; }
    .ru-row.win { background: var(--ru-win-bg); color: var(--ru-accent); font-weight: 700; animation: ru-win-pop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) var(--ru-win-d, 0ms) both; }
    .ru-row.win::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 15%, rgba(255,255,255,0.28) 50%, transparent 85%); transform: translateX(-130%); animation: ru-shine 0.8s ease var(--ru-shine-d, 0ms) both; }
    .ru-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ru-score { font-family: 'Space Mono', monospace; font-size: 0.9rem; font-variant-numeric: tabular-nums; min-width: 1.1em; text-align: right; }
    .ru-you { display: inline-block; font-family: 'DM Sans', sans-serif; font-size: 0.55rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; background: rgba(251,191,36,0.16); border: 1px solid rgba(251,191,36,0.4); border-radius: 4px; padding: 1px 4px; color: #fbbf24; margin-left: 5px; vertical-align: 1px; }
    .ru-note { font-family: 'Space Mono', monospace; font-size: 0.6rem; color: #999; padding: 0 9px 4px; }
    .ru-line { width: 12px; height: 1px; flex-shrink: 0; background: currentColor; opacity: 0.38; transform-origin: left center; animation: ru-draw 0.25s ease var(--ru-d, 0ms) both; }
    .ru-next { width: 106px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; border: 1px solid currentColor; border-radius: 8px; padding: 6px; background: rgba(255,255,255,0.03); font-family: 'DM Sans', sans-serif; font-size: 0.7rem; font-weight: 700; text-align: left; overflow: hidden; animation: ru-fly 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.25) var(--ru-d, 0ms) both, ru-glow 1s ease calc(var(--ru-d, 0ms) + 380ms) both; }
    .ru-next-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ru-news { text-align: left; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 10px; padding-top: 12px; }
    .ru-news-h { display: flex; align-items: center; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.6rem; color: #888; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .ru-news-h::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
    .ru-news ul { margin: 0; padding: 0; list-style: none; }
    .ru-news li { display: flex; align-items: flex-start; gap: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; color: #ddd; line-height: 1.35; margin: 0 0 8px 0; animation: ru-news-in 0.45s cubic-bezier(0.2, 0.85, 0.3, 1.1) var(--ru-d, 0ms) both; }
    .ru-news li:last-child { margin-bottom: 0; }
    .ru-tag { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; font-family: 'Space Mono', monospace; font-size: 0.55rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #bbb; margin-top: 1px; white-space: nowrap; }
    .ru-tag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: var(--ru-tag-c, #fbbf24); }
    .ru-tag.gold { color: #fbbf24; --ru-tag-c: #fbbf24; }
    .ru-tag.red { color: #fca5a5; --ru-tag-c: #ef4444; }
    @keyframes ru-card-in { from { opacity: 0; transform: scale(0.96) translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes ru-sweep { to { transform: translateX(100%); } }
    @keyframes ru-pulse { 0%, 100% { opacity: 0.35; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes ru-match-in { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: none; } }
    @keyframes ru-win-pop { 0% { transform: scale(1); } 45% { transform: scale(1.035); } 100% { transform: scale(1); } }
    @keyframes ru-shine { to { transform: translateX(130%); } }
    @keyframes ru-draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes ru-fly { from { opacity: 0; transform: translateX(-30px) scale(0.7); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }
    @keyframes ru-glow { 0%, 100% { box-shadow: 0 0 0 0 transparent; } 45% { box-shadow: 0 0 16px -2px currentColor; } }
    @keyframes ru-news-in { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .roundup-card, .roundup-card * { animation: none !important; }
    }

    /* Next fixture — a still screen. The stage sits on a ribbon over a framed
       matchup panel, the crests are larger and the numbers become stat tiles. */
    .lobby-stage-ribbon { margin: 4px 16px 0; padding: 8px 14px; border-radius: 10px 10px 0 0;
      background: var(--lobby-badge); color: var(--lobby-badge-text);
      display: flex; align-items: baseline; justify-content: center; gap: 10px;
      font-family: 'DM Sans', sans-serif; text-transform: uppercase; }
    .lobby-stage-ribbon .n { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em; opacity: 0.75; }
    .lobby-stage-ribbon .s { font-size: 1rem; font-weight: 800; letter-spacing: 0.12em; }
    .lobby-match-panel { margin: 0 16px; padding: 22px 12px 18px;
      border: 1px solid rgba(255,255,255,0.14); border-color: color-mix(in srgb, var(--lobby-accent) 45%, transparent);
      border-top: none; border-radius: 0 0 14px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.45);
      display: flex; align-items: center; justify-content: center; gap: 8px; }
    .lobby-match-side { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .lobby-match-side .nm { font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 0.95rem;
      text-align: center; line-height: 1.2; overflow-wrap: anywhere; color: #f0f0f5; }
    .crest-hero.lobby-crest-lg { width: 112px; height: 76px; padding: 7px; border-radius: 10px; }
    .lobby-vs-badge { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid var(--lobby-accent); color: var(--lobby-accent); background: #0a0a0f;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 0.8rem; letter-spacing: 0.04em; }
    .lobby-stat-tiles { margin: 14px 16px 0; display: grid; grid-template-columns: repeat(3, 1fr);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; background: rgba(255,255,255,0.04); }
    .lobby-stat-tile { padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .lobby-stat-tile + .lobby-stat-tile { border-left: 1px solid rgba(255,255,255,0.12); }
    .lobby-tile-label { font-family: 'DM Sans', sans-serif; font-size: 0.62rem; color: #888;
      text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; line-height: 1.25;
      min-height: 2.5em; display: flex; align-items: center; justify-content: center; }
    .lobby-tile-val { font-family: 'Space Mono', monospace; font-size: 1.15rem; font-weight: 700;
      display: flex; align-items: baseline; justify-content: center; gap: 3px; }
    .lobby-kickoff { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 18px; font-size: 1.15rem; letter-spacing: 0.08em; border-radius: 14px;
      border-bottom: 4px solid rgba(0,0,0,0.28); }
    .lobby-kickoff img { width: 30px; height: 30px; }
    .lobby-kickoff:hover { transform: none; }
    .lobby-kickoff:active { transform: translateY(3px) scale(0.94); }
    @media (max-width: 360px) {
      .crest-hero.lobby-crest-lg { width: 96px; height: 66px; }
    }

    /* League table */
    .league-table { width: 100%; border-collapse: collapse; }
    .league-table th { font-family: 'DM Sans', sans-serif; font-size: clamp(0.65rem, 2vw, 0.75rem); color: #888; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .league-table td { font-family: 'Space Mono', monospace; font-size: clamp(0.7rem, 2vw, 0.85rem); padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .league-table tr:last-child td { border-bottom: none; }
    .league-rank { color: #888; font-size: clamp(0.65rem, 1.8vw, 0.75rem); }
    .league-name { font-family: 'DM Sans', sans-serif; color: #f0f0f5; font-size: clamp(0.75rem, 2.5vw, 0.9rem); }
    .league-score { color: #fbbf24; text-align: right; }
    .my-row { background: rgba(251,191,36,0.05); }

    /* Retro league table headers */
    .league-table-retro thead th {
      font-family: 'Press Start 2P', monospace !important;
      font-size: clamp(0.55rem, 1.8vw, 0.7rem) !important;
      color: #00FFFF !important;
      text-transform: none !important;
      letter-spacing: 1px !important;
      text-shadow: 1px 1px 0 #FF1493, 2px 2px 0 #FFD700, 3px 3px 8px rgba(0,0,0,0.8) !important;
      border-bottom: 2px solid #00FFFF !important;
      padding: clamp(8px, 1.5vw, 12px) clamp(8px, 2vw, 12px) !important;
    }
    .league-table-retro tbody tr {
      border-top: 2px solid #FF1493 !important;
      border-bottom: 2px solid #00FFFF !important;
      min-height: 40px;
    }
    .league-table-retro tbody tr:last-child {
      border-bottom: 2px solid #00FFFF !important;
    }
    .league-table-retro .league-rank {
      color: #FFD700 !important;
    }
    .league-table-retro .league-name {
      color: #00FFFF !important;
    }

    /* Victory Stadium */
    #victory-bg { background: linear-gradient(180deg, #0d1b2a 0%, #0d1b2a 55%, #1a6b1a 55%, #1a6b1a 100%); min-height: 100vh; }
    @keyframes wave { 0%,100% { transform: skewX(-2deg); } 50% { transform: skewX(2deg); } }
    .flag-wave { animation: wave 1.2s ease-in-out infinite; transform-origin: bottom center; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .fan-bob { animation: bob 0.8s ease-in-out infinite; }

    /* FAQ */
    .faq-section { margin-bottom: 32px; }
    .faq-section h2 { font-size: 1.1rem; font-weight: 700; color: #fbbf24; margin-bottom: 12px; }
    .faq-section p, .faq-section li { color: #ccc; line-height: 1.7; font-size: 0.9rem; }
    .faq-section ul { padding-left: 20px; margin: 8px 0; }
    .faq-section pre { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; font-family: 'Space Mono', monospace; font-size: 0.78rem; color: #aaa; overflow-x: auto; }

  // TOKEN — read once from URL on load, persist to both stores, then
  // strip ?token= from the URL so hash-changes can never drop it.
  // Every API call sends it as both header and ?token= query param.
  (function() {
    const params = new URLSearchParams(location.search);
    const t = params.get('token');
    if (t) {
      try { localStorage.setItem('usernode_token', t); } catch(_) {}
      try { sessionStorage.setItem('usernode_token', t); } catch(_) {}
      // Strip ?token= from URL so hash navigation can't accidentally drop it.

  function fadeEventTile(cell, delay = EVENT_TILE_HOLD_MS) {

  async function api(method, path, body) {
    const tok = getToken();

    let url = path;

  function hexToRgba(hex, a) {

  // Fraction-based prize curve — mirrors the server. Identical to the original
  // 0.30*(n-16) curve at N=36 (10.8 = 0.30*36, 0.4444 = 16/36).
  function prizeDecay(n, gridSize) {
    const N = gridSize || state.gridSize || 36;
    return Math.max(8, Math.floor(150 / (1 + Math.exp(10.8 * (n / N - 0.4444)))));
  }
  // Per-stage grid + columns, mirrors the server's gridSizeForStage/gridColsForStage.
  function gridSizeForStage(idx) {
    if (idx <= 2) return 16;

    return 49;

  function gridColsForStage(idx) {
    if (idx <= 2) return 4;

  const POT_FLOORS = [100, 160, 230, 320];

    if (idx === 5) return 2;
    return 3;

  function potTopupEnteringStage(idx) {
    if (idx <= 0) return 0;

  const Sound = {

    async ensure() {

        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') await this.ctx.resume();

      osc.frequency.setValueAtTime(freq, start);
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(gain || 0.18, start + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(start); osc.stop(start + dur + 0.02);

  // ═══════════════════════════════════════════════════════════════
  function animatePotValue(el, from, to, ms) {
    const start = performance.now();
    function step(now) {
      const t = Math.min((now - start) / ms, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(from + (to - from) * ease).toLocaleString() + ' t';
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function firePotPulse(chip) {
    const ring = document.createElement('div');
    ring.style.cssText = `position:absolute;inset:0;border-radius:8px;border:2px solid #fbbf24;animation:pot-pulse-ring 0.4s ease forwards;pointer-events:none;`;
    chip.style.position = 'relative';
    chip.appendChild(ring);
    setTimeout(() => ring.remove(), 450);
  }
  function firePotDelta(chip, delta) {
    const lbl = document.createElement('div');
    lbl.className = 'pot-delta';
    lbl.textContent = `⚡ +${delta.toFixed(1)}`;
    lbl.style.cssText = 'top:-10px;left:50%;transform:translateX(-50%);';
    chip.style.position = 'relative';
    chip.appendChild(lbl);
    setTimeout(() => lbl.remove(), 900);
  }
  function updatePotChips(newBalance, newLastWonAt, winnerName) {
    const prev = state.prevPotBalance;
    const jackpotHit = newLastWonAt && newLastWonAt !== state.potLastWonAt;

    document.querySelectorAll('.pot-chip-value').forEach(el => {
      const chip = el.closest('.pot-chip');
      // The next-fixture lobby sits still: the value just updates there.
      if (chip && chip.closest('#lobby-body')) {
        el.textContent = Math.round(newBalance).toLocaleString() + ' t';
        chip.classList.remove('pot-heartbeat');
        return;
      }
      if (jackpotHit) {
        animatePotValue(el, prev, 0, 1000);
        setTimeout(() => { animatePotValue(el, 0, newBalance, 500); }, 1000);
        if (chip) { setTimeout(() => { chip.style.background = 'white'; setTimeout(() => { chip.style.background = ''; }, 200); }, 1000); }
      } else if (newBalance > prev + 0.01) {
        animatePotValue(el, prev, newBalance, 600);
        if (chip) { firePotPulse(chip); firePotDelta(chip, newBalance - prev); }
      } else {
        el.textContent = Math.round(newBalance).toLocaleString() + ' t';
      }
      if (chip) {
        if (newBalance > 500) chip.classList.add('pot-heartbeat');
        else chip.classList.remove('pot-heartbeat');
      }
    });

    if (jackpotHit) {
      const who = winnerName || 'Someone';
      showToast(`⚡ JACKPOT! ${who} just won the Captain's Pot!`);
      state.potLastWonAt = newLastWonAt;
    }
    state.prevPotBalance = newBalance;
    state.potBalance = newBalance;
  }

  // ═══════════════════════════════════════════════════════════════
  // CONFETTI
  // ═══════════════════════════════════════════════════════════════
  let confettiLoop = null;
  let confettiResetTimer = null;
  function resetConfetti() {
    if (confettiResetTimer) { clearTimeout(confettiResetTimer); confettiResetTimer = null; }
    if (window.confetti && typeof confetti.reset === 'function') confetti.reset();
  }
  function startConfetti() {
    // Cancel any delayed reset left over from an earlier celebration,
    // so it can't wipe particles from the new one
    if (confettiResetTimer) { clearTimeout(confettiResetTimer); confettiResetTimer = null; }
    if (confettiLoop) return;
    confettiLoop = setInterval(() => {
      confetti({ particleCount: 6, spread: 70, origin: { y: 0.4 }, colors: ['#fbbf24','#10b981','#3b82f6','#ef4444','#8b5cf6'] });
    }, 200);
  }
  function stopConfetti(immediate) {
    if (confettiLoop) { clearInterval(confettiLoop); confettiLoop = null; }
    if (immediate) { resetConfetti(); return; }
    // Grace delay: falling particles get a few seconds to land, then the
    // canvas is cleared so nothing stays frozen over the board
    if (confettiResetTimer) clearTimeout(confettiResetTimer);
    confettiResetTimer = setTimeout(resetConfetti, 4000);
  }
  // If the tab or iframe was hidden mid-celebration, the library's rAF loop
  // stalls and particles stay frozen on the canvas — clear them on return
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') resetConfetti();
  });

  function clearFrontendState() {
    state = {

      squaresRevealed: 0, prizePot: 148,

  function confirmResetGame() {
    const confirmed = confirm('This will clear all game data and reset all player balances to 2000 tokens. Continue?');
    if (!confirmed) return;
    resetGame();
  }

  async function resetGame() {
    try {
      const r = await api('POST', '/api/admin/reset-game');
      if (r.ok) {
        showToast('Game reset complete');
        clearFrontendState();
        setTimeout(() => location.reload(), 500);
      } else {
        const err = await r.json();
        showToast('Reset failed: ' + (err.error || 'Unknown error'));
      }
    } catch (err) {
      showToast('Reset failed: ' + err.message);
    }
  }

  function route() {
    clearPolls();
    stopConfetti(true);
    const hash = location.hash || '#lobby';

    // Selectively stop audio based on where we're navigating FROM
    // Don't use stopAllAudio() blindly — it kills audio like victory music
    // that should continue playing during transitions
    Sound.stopIntro();
    Sound.stopLeaderboard();
    // When leaving the victory stadium, stop the victory music
    if (state.showingVictoryStadium) {
      Sound.stopWinthecup();
      state.showingVictoryStadium = false;
    }
    // Note: stopFindball/stopSuccesspurchase are context-specific
    // and should only be stopped when appropriate for the target route

    document.getElementById('goal-ball')?.remove();
    const flagBgEl = document.getElementById('flag-bg');
    if (flagBgEl) {
      flagBgEl.style.backgroundImage = '';
      flagBgEl.style.setProperty('--overlay-opacity', '1');
    }
    document.documentElement.style.removeProperty('--accent');
    document.documentElement.style.removeProperty('--accent-soft');
    if (hash === '#lobby' || hash === '#') {
      Sound.playIntro();
      renderLobby();
    }
    else if (hash === '#demo/final-refund') demoFinalRefund();
    else if (hash === '#demo/roundup') demoRoundup('group');
    else if (hash === '#demo/fixture') demoFixture();
    else if (hash === '#demo/roundup-qf') demoRoundup('qf');
    else if (hash === '#demo/penalty') demoPenaltyKick();
    else if (hash === '#demo/penalty-keeper') demoPenaltyKick('keeper');
    else if (hash.startsWith('#game/')) renderGame(hash.replace('#game/', ''));
    else if (hash === '#league') {
      Sound.playLeaderboard();
      renderLeague();
    }
    else if (hash === '#faq') renderFaq();
    else renderLobby();
  }
  window.addEventListener('hashchange', route);

  // Staging demo deep link: seeds a Final board with carried shots (server
  // returns 404 outside staging) and opens it. It does not touch the viewer's
  // tournament, so the lobby still offers the club picker afterwards.
  async function demoFinalRefund() {
    const appEl = document.getElementById('app');
    try {
      const seed = await api('POST', '/api/staging/demo-final-refund');
      if (!seed.ok) { navigate('#lobby'); return; }
      const d = await seed.json();
      state.session = { ...state.session, ...(d.session || {}), current_game_id: d.game.id };
      navigate('#game/' + d.game.id);
    } catch (e) {
      if (appEl) appEl.innerHTML = `<div style="text-align:center;padding:40px;color:#888;font-family:'DM Sans',sans-serif;">Demo unavailable — open the lobby instead.</div>`;
    }
  }

  // Staging demo deep link: leaves a penalty kick waiting on the staging group
  // board (server returns 404 outside staging) and opens the board with the
  // kick screen up, so the screen is reachable without guessing blind.
  async function demoPenaltyKick(role) {
    try {
      // Each demo link shows one role; the real kick rolls its own.
      const seed = await api('POST', '/api/staging/demo-penalty', { role: role || 'taker' });
      if (!seed.ok) { navigate('#lobby'); return; }
      const d = await seed.json();
      state.session = { ...state.session, current_game_id: d.game_id };
      // The seed already knows which game and kick it left, so the kick screen
      // opens right away and stays over the board while that board loads.
      state.game = { ...(state.game || {}), id: d.game_id };
      navigate('#game/' + d.game_id);
      openPenaltyKick(d.square_index, d.bonus_on_goal, d.role);
    } catch (e) {
      navigate('#lobby');
    }
  }

  // Staging demo deep link: opens the between-match round-up on its own, built
  // from the club list, so the screen is reachable without playing a match.
  // '#demo/roundup' shows a group round, '#demo/roundup-qf' a Quarter-Final.
  // Nothing is written: Continue returns to the lobby.
  function demoRoundup(variant) {
    const slugs = (state.themes || []).map(t => t.slug);
    if (slugs.length < 8) { navigate('#lobby'); return; }
    const qf = variant === 'qf';
    const session = {
      my_team_slug: slugs[0],
      played_slugs: qf ? slugs.slice(1, 6) : slugs.slice(1, 3),
      stage_idx: qf ? 5 : 2,
      next_opponent_slug: slugs[qf ? 7 : 4],
    };
    let model = null;
    try { model = buildRoundup(session, state.themes); } catch (e) { model = null; }
    if (!model) { navigate('#lobby'); return; }
    document.querySelectorAll('.result-overlay').forEach(e => e.remove());
    renderRoundup(model, () => navigate('#lobby'));
  }

  // Staging demo deep link: shows the next-fixture lobby hero from the club
  // list, so the screen is reachable without a tournament. Nothing is written:

  function demoFixture() {
    const themes = state.themes || [];

    document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;">
      ${renderHeader()}

    renderLobbyBody({ my_team_slug: themes[0].slug, stage_idx: 1, session_complete: false, current_game_id: null });

    document.getElementById('info-panel')?.remove();
    const kickOff = document.querySelector('#lobby-body .bundle-btn');
    if (kickOff) kickOff.onclick = () => navigate('#lobby');

  async function loadLobby() {
    const body = document.getElementById('lobby-body');
    function showLobbyError(msg, isAuth) {
      console.error('Lobby error:', msg);
      if (body) body.innerHTML = `<div style="text-align:center;padding:40px;font-family:'DM Sans',sans-serif;">
        <p style="color:#ccc;margin-bottom:16px;">Couldn't load the game. Check your connection and try again.</p>
        <button class="bundle-btn btn-gold" style="min-height:44px;padding:10px 18px;" onclick="loadLobby()">Try again</button>
        ${isAuth ? `<p style="margin-top:12px;font-size:0.75rem;color:#a1a1aa;">Sign in via Usernode to play.</p>` : ''}
      </div>`;
    }
    try {
      const sessionRes = await api('GET', '/api/session');
      if (!sessionRes.ok) {
        let detail = 'HTTP ' + sessionRes.status;
        try { const e = await sessionRes.json(); if (e && e.error) detail += ' — ' + e.error; } catch(_) {}
        showLobbyError(detail, sessionRes.status === 401);
        return;
      }
      const data = await sessionRes.json();
      const session = data.session;
      const captain_pot_balance = data.captain_pot_balance;
      let wallet_balance = data.wallet_balance;
      const next_opponent_theme = data.next_opponent_theme;

      state.session = session;
      state.next_opponent_theme = next_opponent_theme;
      // The in-game balance (via /api/session, which reads player_wallets)
      state.walletBalance = wallet_balance || state.walletBalance || 1000;
      state.potBalance = captain_pot_balance || 100;
      state.prevPotBalance = state.potBalance;
      // Seed the last-won marker from the server so the first poll doesn't
      // mistake a pre-existing win for a fresh one (phantom broadcast).
      if (data.last_won_at) state.potLastWonAt = data.last_won_at;

      renderLobbyBody(session);
      setupLobbyPolls();
    } catch(e) {
      showLobbyError(e && e.message ? e.message : String(e));
    }
  }

  async function renderGame(id) {
    const app = document.getElementById('app');
    app.innerHTML = `<div class="game-screen">
      <div class="stadium" aria-hidden="true">
        <div class="stadium-stands"></div>
        <div class="stadium-pitch"><div class="stadium-goal"></div></div>
