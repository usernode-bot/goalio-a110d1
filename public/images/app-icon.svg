      <stop offset="0" stop-color="#1e5b3f"/>
      <stop offset="1" stop-color="#062417"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a86f0c"/>
      <stop offset="0.35" stop-color="#ffe27a"/>
